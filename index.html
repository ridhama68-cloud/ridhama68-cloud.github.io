/* ================== TEAM ACTIVITY (admin: who's online / login times) ================== */
function TeamActivity({sessions,internNames}){
  const [,setTick]=useState(0);
  useEffect(()=>{ const id=setInterval(()=>setTick(t=>t+1),30000); return ()=>clearInterval(id); },[]);
  sessions=sessions||[];
  // Latest session per intern for today (last row wins).
  const byIntern={};
  sessions.forEach(s=>{ byIntern[s.Intern]=s; });
  const names = internNames && internNames.length ? internNames : Object.keys(byIntern);
  const dot=(status)=>{
    const st=String(status||"");
    if(/logged out/i.test(st)) return "bg-slate-300";
    if(/idle/i.test(st)) return "bg-amber-500";
    if(/working/i.test(st)) return "bg-green-500";
    return "bg-slate-300";
  };
  const label=(s)=>{
    if(!s) return "Not logged in today";
    return String(s.Status||"—");
  };
  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-4">
      <div className="font-semibold mb-1">🟢 Team activity today</div>
      <div className="text-[11px] text-slate-400 mb-2">Login time, current status, and how long each intern has been dialing. Auto-refreshes.</div>
      <div className="overflow-x-auto no-scrollbar">
        <table className="w-full text-sm">
          <thead className="text-slate-500 text-left"><tr>
            <th className="py-1 pr-4">Intern</th><th className="py-1 px-2">Status</th><th className="py-1 px-2">Login</th>
            <th className="py-1 px-2">Last active</th><th className="py-1 px-2">Worked</th><th className="py-1 px-2">Idle</th>
            <th className="py-1 px-2">Convos</th><th className="py-1 px-2">Recs</th><th className="py-1 px-2">Logout</th></tr></thead>
          <tbody>
            {names.map(name=>{
              const s=byIntern[name];
              return (
                <tr key={name} className="border-t border-slate-100">
                  <td className="py-2 pr-4 font-medium flex items-center gap-2"><span className={"w-2.5 h-2.5 rounded-full "+dot(s&&s.Status)}></span>{name}</td>
                  <td className="py-2 px-2 text-slate-600">{label(s)}</td>
                  <td className="py-2 px-2">{s?s.Login:"—"}</td>
                  <td className="py-2 px-2 text-slate-500">{s?s["Last Active"]:"—"}</td>
                  <td className="py-2 px-2">{s?(s["Work Min"]||0)+"m":"—"}</td>
                  <td className="py-2 px-2 text-amber-600">{s?(s["Idle Min"]||0)+"m":"—"}</td>
                  <td className="py-2 px-2">{s&&s.Convos!==""?s.Convos:"—"}</td>
                  <td className="py-2 px-2">{s&&s.Recordings!==""?s.Recordings:"—"}</td>
                  <td className="py-2 px-2 text-slate-500">{s&&s.Logout?s.Logout:"—"}</td>
                </tr>
              );
            })}
            {names.length===0 && <tr><td colSpan="9" className="py-3 text-slate-400">No sessions yet today.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// Date-filtered funnel dashboard. Reads the per-day activity log (DAILY) for
// dialed/convos/website/booked/show-ups/closes, and the leads' Timestamp for
// "Leads". The chosen date range is remembered in localStorage until changed.
/* ================== PIPELINE BOARD ================== */
// Kanban board: move a lead Working -> Website Sent -> Meeting Booked -> Showed up -> Closed.
// Advancing stamps that milestone on the backend (earlier stamps are kept), so the
// dashboard funnel never decreases. Dead outcomes (No Show / Not Interested / Dumped)
// drop off the board but keep whatever milestones they already reached.
const PIPE_COLS=["Working","Website Sent","Meeting Booked","Showed up","Closed"];
function pipeStage(l){
  const s=String(l.Status||"").toLowerCase();
  if(/landed/.test(s)) return "Closed";
  if(/not interested|dumped|no show/.test(s)) return null;
  if(/meeting booked/.test(s)) return l["Showup Date"]?"Showed up":"Meeting Booked";
  if(/website sent/.test(s)) return "Website Sent";
  return "Working";
}
function PipelineBoard({leads,refresh,notify,members}){
  const [cat,setCat]=useState("All");
  const [who,setWho]=useState("All");
  const [city,setCity]=useState("All");
  const [drag,setDrag]=useState(null);
  const [book,setBook]=useState(null);
  const [dt,setDt]=useState({date:todayISO(),time:"11:00"});
  const cats=useMemo(function(){ const s={}; leads.forEach(function(l){ const f=String(l.Folder||"").trim(); if(f) s[f]=1; }); return Object.keys(s).sort(); },[leads]);
  const cityList=useMemo(function(){ const s={}; leads.forEach(function(l){ const c=cityGroup(l.City); if(c) s[c]=1; }); return Object.keys(s).sort(); },[leads]);
  const scoped=leads.filter(function(l){
    if(cat!=="All" && String(l.Folder||"").trim()!==cat) return false;
    if(city!=="All" && cityGroup(l.City)!==city) return false;
    if(who!=="All" && String(l["Assigned To"]||"").trim().toLowerCase()!==who.toLowerCase()) return false;
    return true;
  });
  const byCol={}; PIPE_COLS.forEach(function(c){ byCol[c]=[]; });
  scoped.forEach(function(l){ const c=pipeStage(l); if(c) byCol[c].push(l); });
  async function apply(l,stage,extra){
    const p={action:"upsert", lead:Object.assign({ID:l.ID},extra||{})};
    if(stage==="Website Sent"){ p.lead.Status="Website Sent"; p.logStat={intern:l["Assigned To"]||"", outcome:"Website Sent"}; }
    else if(stage==="Meeting Booked"){ p.lead.Status="Meeting Booked"; p.logStat={intern:l["Assigned To"]||"", outcome:"Meeting Booked"}; }
    else if(stage==="Showed up"){ if(!/meeting booked/i.test(l.Status||"")) p.lead.Status="Meeting Booked"; p.logStat={intern:l["Assigned To"]||"", outcome:"Showed Up", dial:false}; }
    else if(stage==="Closed"){ p.lead.Status="Landed"; p.logStat={intern:l["Assigned To"]||"", outcome:"Landed", dial:false}; }
    else if(stage==="Working"){ p.lead.Status="Interested"; }
    const res=await apiPost(p); if(res.ok){ notify("→ "+stage); refreshLight(); } else notify("Failed: "+(res.error||""));
  }
  function move(l,stage){ if(!stage||stage===pipeStage(l)) return; if(stage==="Meeting Booked"){ setDt({date:l["Meeting Date"]||todayISO(), time:l["Meeting Time"]||"11:00"}); setBook({lead:l}); } else apply(l,stage); }
  return (
    <div className="space-y-3">
      <div className="flex items-center gap-2 flex-wrap">
        <div className="font-semibold">🧭 Pipeline</div>

        {cats.length>0 &&

        {cityList.length>0 &&

// Pipeline funnel stages -> the lead milestone-stamp column each one counts.
const FUNNEL_STAGES=[["Leads","Timestamp","text-slate-800"],["Dialed","Dialed Date","text-indigo-600"],["Conversation","Convo Date","text-blue-600"],["Website Sent","Website Sent Date","text-cyan-600"],["Meeting Booked","Booked Date","text-green-600"],["Showed up","Showup Date","text-emerald-600"],["Closed","Closed Date","text-emerald-700"]];

function FunnelDashboard({leads,internNames}){
  function isoOf(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  const [range,setRange]=useState(function(){
    try{ const s=JSON.parse(localStorage.getItem("reactivify.dashRange")||"null"); if(s&&s.from&&s.to) return s; }catch(e){}
    const t=todayISO(); return {mode:"today", from:t, to:t};
  });
  useEffect(function(){ try{ localStorage.setItem("reactivify.dashRange", JSON.stringify(range)); }catch(e){} },[range]);
  const [ratio,setRatio]=useState(function(){ try{ return JSON.parse(localStorage.getItem("reactivify.dashRatio")||"null")||{from:"Dialed",to:"Closed"}; }catch(e){ return {from:"Dialed",to:"Closed"}; } });
  useEffect(function(){ try{ localStorage.setItem("reactivify.dashRatio", JSON.stringify(ratio)); }catch(e){} },[ratio]);
  const [dcat,setDcat]=useState(function(){ try{ return localStorage.getItem("reactivify.dashCat")||"All"; }catch(e){ return "All"; } });
  useEffect(function(){ try{ localStorage.setItem("reactivify.dashCat", dcat); }catch(e){} },[dcat]);
  const [dcity,setDcity]=useState(function(){ try{ return localStorage.getItem("reactivify.dashCity")||"All"; }catch(e){ return "All"; } });
  useEffect(function(){ try{ localStorage.setItem("reactivify.dashCity", dcity); }catch(e){} },[dcity]);
  function setPreset(mode){
    const to=todayISO(); const d=new Date(); let from=to;
    if(mode==="7d"){ d.setDate(d.getDate()-6); from=isoOf(d); }
    else if(mode==="30d"){ d.setDate(d.getDate()-29); from=isoOf(d); }
    else if(mode==="month"){ from=to.slice(0,8)+"01"; }
    else if(mode==="all"){ from="2020-01-01"; }
    setRange({mode:mode, from:from, to:to});
  }
  const from=range.from, to=range.to;
  const inRange=function(ds){ ds=String(ds||"").slice(0,10); return ds && ds>=from && ds<=to; };
  // Niche + City filters — see the funnel for one category / city at a time.
  const nicheList=(function(){ const s={}; leads.forEach(function(l){ const f=String(l.Folder||"").trim(); if(f) s[f]=1; }); return Object.keys(s).sort(); })();
  const cityL=(function(){ const s={}; leads.forEach(function(l){ const c=cityGroup(l.City); if(c) s[c]=1; }); return Object.keys(s).sort(); })();
  const scoped=leads.filter(function(l){
    if(dcat!=="All" && String(l.Folder||"").trim()!==dcat) return false;
    if(dcity!=="All" && cityGroup(l.City)!==dcity) return false;
    return true;
  });
  // "Leads" = leads added in the range. Every other stage comes from the per-day
  // call log (the same data as "Calls per day"): each logged call counts, redials included.
  function count(list,col){ return list.filter(function(l){ return inRange(l[col]); }).length; }
  const [daily,setDaily]=useState(null);
  useEffect(function(){ apiGet("getDailyCalls").then(function(r){ if(r&&r.ok) setDaily(r.daily||{}); }).catch(function(){}); },[leads]);
  function dailyCounts(name){
    const o={"Dialed":0,"Conversation":0,"Website Sent":0,"Meeting Booked":0,"Showed up":0,"Closed":0};
    if(!daily) return o;
    Object.keys(daily).forEach(function(day){
      if(day<from||day>to) return;
      const d=daily[day]||{};
      Object.keys(d).forEach(function(who){
        if(name && String(who).trim().toLowerCase()!==name.toLowerCase()) return;
        const rec=d[who]||{};
        const n=function(k){ return rec[k]||0; };
        const showed=n("Showed Up");
        const dials=(rec.calls||0)-n("Dumped")-showed;
        o["Dialed"]+=dials; o["Conversation"]+=dials-n("Not Answering");
        o["Website Sent"]+=n("Website Sent"); o["Meeting Booked"]+=n("Meeting Booked"); o["Showed up"]+=showed; o["Closed"]+=n("Landed");
      });
    });
    return o;
  }
  const dTeam=dailyCounts(null);
  const team={}; FUNNEL_STAGES.forEach(function(s){ team[s[0]]= s[0]==="Leads" ? count(scoped,s[1]) : dTeam[s[0]]; });
  const rows=internNames.map(function(name){
    const mine=scoped.filter(function(l){ return String(l["Assigned To"]||"").trim().toLowerCase()===name.toLowerCase(); });
    const dm=dailyCounts(name);
    const o={name:name}; FUNNEL_STAGES.forEach(function(s){ o[s[0]]= s[0]==="Leads" ? count(mine,s[1]) : dm[s[0]]; }); return o;
  });
  const stageCol=function(n){ const f=FUNNEL_STAGES.find(function(s){ return s[0]===n; }); return f?f[1]:"Timestamp"; };
  const pctOf=function(a,b){ return team[a]>0? Math.round(team[b]/team[a]*100):0; };
  const presets=[["today","Today"],["7d","Last 7 days"],["30d","Last 30 days"],["month","This month"],["all","All time"]];
  const chain=["Dialed","Conversation","Website Sent","Meeting Booked","Showed up","Closed"];
  const chipCols={"Leads":"text-slate-800","Dialed":"text-indigo-600","Conversation":"text-blue-600","Website Sent":"text-cyan-600","Meeting Booked":"text-green-600","Showed up":"text-emerald-600","Closed":"text-emerald-700"};
  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-4 space-y-3">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div className="font-semibold">📊 Dashboard</div>
        <div className="text-[11px] text-slate-400">Saved until you change it</div>
      </div>
      <div className="flex flex-wrap gap-1.5">
        {presets.map(function(p){ return <button key={p[0]} onClick={()=>setPreset(p[0])} className={"px-2.5 py-1 rounded-full text-xs "+(range.mode===p[0]?"bg-slate-900 text-white":"bg-slate-100 text-slate-600")}>{p[1]}</button>; })}
      </div>
      <div className="flex items-center gap-2 text-xs text-slate-500 flex-wrap">
        <span>From</span>
        <input type="date" value={from} onChange={e=>setRange({mode:"custom",from:e.target.value,to:to})} className="border rounded-lg px-2 py-1 text-xs"/>
        <span>to</span>
        <input type="date" value={to} onChange={e=>setRange({mode:"custom",from:from,to:e.target.value})} className="border rounded-lg px-2 py-1 text-xs"/>
        {nicheList.length>0 &&
          <select value={dcat} onChange={e=>setDcat(e.target.value)} className="border rounded-lg px-2 py-1 text-xs"><option value="All">📁 All niches</option>{nicheList.map(function(n){ return <option key={n}>{n}</option>; })}</select>}
        {cityL.length>0 &&
          <select value={dcity} onChange={e=>setDcity(e.target.value)} className="border rounded-lg px-2 py-1 text-xs"><option value="All">📍 All cities</option>{cityL.map(function(c){ return <option key={c}>{c}</option>; })}</select>}
        {(dcat!=="All"||dcity!=="All") && <button onClick={()=>{setDcat("All");setDcity("All");}} className="text-indigo-600">clear</button>}
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-2">
        {FUNNEL_STAGES.map(function(s){ return <div key={s[0]} className="rounded-xl border border-slate-100 bg-slate-50 p-3"><div className={"text-2xl font-bold "+s[2]}>{team[s[0]]}</div><div className="text-[11px] text-slate-500 mt-0.5">{s[0]}</div></div>; })}
      </div>

      {/* Conversion rates between consecutive stages */}
      <div className="border-t border-slate-100 pt-3">
        <div className="text-sm font-semibold mb-2">Conversion rates</div>
        <div className="flex flex-wrap gap-2">
          {chain.slice(0,-1).map(function(st,i){ const nx=chain[i+1]; const p=pctOf(st,nx); return (
            <div key={st} className="flex-1 min-w-[130px] rounded-xl border border-slate-100 bg-slate-50 px-3 py-2">
              <div className="text-lg font-bold text-slate-800">{p}%</div>
              <div className="text-[11px] text-slate-500">{st} → {nx}</div>
              <div className="text-[10px] text-slate-400">{team[nx]} of {team[st]}</div>
            </div>); })}
        </div>
      </div>

      {/* Flexible any-to-any ratio picker */}
      <div className="flex items-center gap-2 text-sm flex-wrap bg-indigo-50 rounded-xl px-3 py-2">
        <span className="text-xs text-slate-500">Custom ratio:</span>
        <select value={ratio.from} onChange={e=>setRatio({from:e.target.value,to:ratio.to})} className="border rounded-lg px-2 py-1 text-sm">
          {FUNNEL_STAGES.map(function(s){ return <option key={s[0]}>{s[0]}</option>; })}</select>
        <span>→</span>
        <select value={ratio.to} onChange={e=>setRatio({from:ratio.from,to:e.target.value})} className="border rounded-lg px-2 py-1 text-sm">
          {FUNNEL_STAGES.map(function(s){ return <option key={s[0]}>{s[0]}</option>; })}</select>
        <span className="ml-1 text-lg font-bold text-indigo-700">{pctOf(ratio.from,ratio.to)}%</span>
        <span className="text-[11px] text-slate-500">({team[ratio.to]} of {team[ratio.from]})</span>
      </div>

      <div className="overflow-x-auto no-scrollbar">
        <table className="w-full text-sm">
          <thead className="text-slate-500 text-left"><tr>
            <th className="py-1 pr-3">Member</th>{FUNNEL_STAGES.map(function(s){ return <th key={s[0]} className="py-1 px-2">{s[0]==="Meeting Booked"?"Booked":s[0]==="Conversation"?"Convos":s[0]==="Website Sent"?"Website":s[0]}</th>; })}</tr></thead>
          <tbody>
            {rows.map(function(r){ return <tr key={r.name} className="border-t border-slate-100">
              <td className="py-2 pr-3 font-medium">{r.name}</td>
              {FUNNEL_STAGES.map(function(s){ return <td key={s[0]} className={"py-2 px-2 "+(s[0]==="Closed"?"font-semibold":s[0]==="Leads"?"text-slate-500":"")}>{r[s[0]]}</td>; })}
            </tr>; })}
          </tbody>
        </table>
      </div>
      <div className="text-[11px] text-slate-400">Dialed / Convos / Website / Booked / Showed up / Closed count every call logged in the range (redials included), from the same log as "Calls per day". Dumped is not a dial and Not Answering is not a conversation. The niche / city filter only narrows "Leads". The call log keeps the last 120 days.</div>
    </div>
  );
}

function SummaryCards({leads}){
  const total=leads.length;
  const unassigned=leads.filter(l=>!l["Assigned To"]||l["Assigned To"]==="Team").length;
  const contacted=leads.filter(l=>l.Status && l.Status!=="New").length;
  const booked=leads.filter(l=>/booked/i.test(l.Status||"")).length;
  const followups=leads.filter(l=>/follow/i.test(l.Status||"")||l["Followup Date"]).length;
  const landed=leads.filter(l=>/landed/i.test(l.Status||"")).length;
  const card=(label,val,color)=>(<div className="bg-white rounded-2xl border border-slate-200 p-4"><div className={"text-2xl font-bold "+(color||"text-slate-800")}>{val}</div><div className="text-xs text-slate-500 mt-1">{label}</div></div>);
  const byCity={}; leads.forEach(l=>{const c=cityGroup(l.City);byCity[c]=(byCity[c]||0)+1;});
  const cityRows=Object.keys(byCity).map(c=>[c,byCity[c]]).sort((a,b)=>b[1]-a[1]);
  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
        {card("Total leads",total)}
        {card("Unassigned",unassigned,"text-amber-600")}
        {card("Contacted",contacted,"text-blue-600")}
        {card("Meetings booked",booked,"text-green-600")}
        {card("Follow-ups",followups,"text-amber-600")}
        {card("Landed (won)",landed,"text-emerald-600")}
      </div>
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="font-semibold mb-2">Leads by city</div>
        <div className="space-y-1.5">
          {cityRows.map(row=>(
            <div key={row[0]} className="flex items-center gap-2 text-sm">
              <div className="w-28 truncate">{row[0]}</div>
              <div className="flex-1 bg-slate-100 rounded-full h-2 overflow-hidden"><div className="bg-indigo-500 h-2" style={{width:(total?row[1]/total*100:0)+"%"}}></div></div>
              <div className="w-10 text-right text-slate-500">{row[1]}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function DuplicatesTool({leads,refresh,notify}){
  const [busy,setBusy]=useState(false);
  const [review,setReview]=useState(false);
  function keyOf(l){ const p=String(l.Phone||"").replace(/\D/g,""); if(p) return "p:"+p.slice(-10); const n=String(l.Clinic||l.Name||"").trim().toLowerCase(); return n?"n:"+n:""; }
  const groups=useMemo(()=>{
    const m={}; leads.forEach(l=>{ const k=keyOf(l); if(!k) return; (m[k]=m[k]||[]).push(l); });
    return Object.keys(m).map(k=>m[k]).filter(g=>g.length>1);
  },[leads]);
  const dupCount=groups.reduce((a,g)=>a+(g.length-1),0);
  function score(l){ let s=0; if(/booked|landed/i.test(l.Status||""))s+=5; if(l.Notes)s+=3; if(l["Assigned To"]&&l["Assigned To"]!=="Team")s+=2; if(l["Followup Date"])s+=2; if(l.Email)s+=1; return s; }
  async function removeAll(){
    if(!dupCount) return;
    if(!confirm("Remove "+dupCount+" duplicate lead(s)? The best record in each group (meeting/notes/assignment) is kept.")) return;
    setBusy(true);
    for(let gi=0; gi<groups.length; gi++){
      const g=groups[gi].slice().sort((a,b)=>score(b)-score(a));
      for(let i=1;i<g.length;i++){ await apiPost({action:"delete", id:g[i].ID}); }
    }
    setBusy(false); notify("Removed "+dupCount+" duplicates"); refreshLight();
  }
  async function delOne(id){
    if(!confirm("Delete this duplicate record? (This can't be undone.)")) return;
    setBusy(true); const res=await apiPost({action:"delete", id}); setBusy(false);
    notify(res.ok?"Deleted":"Failed"); refreshLight();
  }
  if(!groups.length) return <div className="bg-white rounded-2xl border border-slate-200 p-4 text-sm text-slate-500">✓ No duplicate leads found.</div>;
  return (
    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 space-y-3">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div className="font-semibold text-amber-900">🔁 Duplicates: {groups.length} groups · {dupCount} extra record(s)</div>
        <div className="flex gap-2">
          <button onClick={()=>setReview(!review)} className="px-3 py-1.5 rounded-lg bg-white border border-amber-300 text-amber-800 text-sm">{review?"Hide review":"Review & choose"}</button>
          <button onClick={removeAll} disabled={busy} className="px-3 py-1.5 rounded-lg bg-amber-600 text-white text-sm disabled:opacity-40">{busy?"Removing…":"Auto-remove (keep best)"}</button>
        </div>
      </div>
      {!review
        ? <div className="max-h-40 overflow-y-auto no-scrollbar text-xs text-amber-800 space-y-0.5">
            {groups.slice(0,30).map((g,i)=><div key={i}>• {g[0].Clinic||g[0].Name} — {g.length} copies</div>)}
          </div>
        : <div className="space-y-2 max-h-96 overflow-y-auto no-scrollbar">
            {groups.map((g,gi)=>{
              const best=g.slice().sort((a,b)=>score(b)-score(a))[0];
              return (
                <div key={gi} className="bg-white rounded-lg border border-amber-200 p-2">
                  <div className="text-[11px] font-semibold text-slate-500 mb-1">{g.length} copies of “{g[0].Clinic||g[0].Name}”</div>
                  {g.map(l=>(
                    <div key={l.ID} className="flex items-center justify-between text-sm border-t border-slate-100 py-1.5 first:border-0">
                      <div className="min-w-0">
                        <span className="font-medium">{l.Clinic||l.Name}</span>
                        {l.ID===best.ID && <span className="ml-2 text-[10px] px-1.5 py-0.5 rounded-full bg-green-100 text-green-700">keep</span>}
                        <div className="text-[11px] text-slate-400 truncate">{l.Phone||"no phone"} · {l.City||"—"} · {l["Assigned To"]||"unassigned"} · {l.Status||"New"}{l.Notes?" · has notes":""}</div>
                      </div>
                      <button onClick={()=>delOne(l.ID)} disabled={busy} className="text-red-500 text-xs ml-2 shrink-0">Delete</button>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>}
      <div className="text-[11px] text-amber-700">Auto-remove keeps the record with a meeting / notes / assignment and deletes the rest. Or <b>Review &amp; choose</b> to pick exactly which copies to delete.</div>
    </div>
  );
}

function RangeAssign({leads,internNames,onDone,notify}){
  const [open,setOpen]=useState(false);
  const [from,setFrom]=useState(""); const [to,setTo]=useState(""); const [who,setWho]=useState(internNames[0]);
  async function go(){
    const f=parseInt(from,10), t=parseInt(to,10);
    if(!f||!t){ notify("Enter a row range"); return; }
    const rows=leads.slice(f-1,t).map(l=>l._row).filter(Boolean);
    if(!rows.length){ notify("No leads in that range"); return; }
    const res=await apiPost({action:"bulkField", rows, field:"Assigned To", value:who});
    notify(res.ok?("Assigned "+res.updated+" to "+who):"Failed"); setOpen(false); onDone();
  }
  if(!open) return <button onClick={()=>setOpen(true)} className="px-3 py-2 rounded-lg bg-slate-100 text-sm">Assign by range</button>;
  return (
    <div className="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1">
      <span className="text-sm">rows</span>
      <input value={from} onChange={e=>setFrom(e.target.value)} className="w-14 border rounded px-1 py-0.5 text-sm" placeholder="1"/>
      <span className="text-sm">to</span>
      <input value={to} onChange={e=>setTo(e.target.value)} className="w-14 border rounded px-1 py-0.5 text-sm" placeholder="50"/>
      <span className="text-sm">→</span>
      <select value={who} onChange={e=>setWho(e.target.value)} className="border rounded px-1 py-0.5 text-sm">
        {internNames.map(n=><option key={n}>{n}</option>)}</select>
      <button onClick={go} className="px-2 py-0.5 rounded bg-indigo-600 text-white text-sm">Go</button>
      <button onClick={()=>setOpen(false)} className="px-1 text-slate-400">✕</button>
    </div>
  );
}

function sortLeads(leads,by){
  const cp=[...leads];
  if(by==="reviews") cp.sort((a,b)=>num(b.Reviews)-num(a.Reviews));
  else if(by==="rating") cp.sort((a,b)=>num(b.Rating)-num(a.Rating));
  else if(by==="internal") cp.sort((a,b)=>gradeRank(a)-gradeRank(b));
  else if(by==="smart") cp.sort((a,b)=>(statusRank(a)-statusRank(b))||(gradeRank(a)-gradeRank(b))||(num(b.Reviews)-num(a.Reviews)));
  return cp;
}

function StatusBadge({status}){
  const s=status||"New";
  const color=/Booked/i.test(s)?"bg-green-100 text-green-700"
    :/Landed/i.test(s)?"bg-emerald-100 text-emerald-700"
    :/Website Sent/i.test(s)?"bg-cyan-100 text-cyan-700"
    :/Interested/i.test(s)&&!/Not/i.test(s)?"bg-blue-100 text-blue-700"
    :/Dumped|Not Interested/i.test(s)?"bg-slate-200 text-slate-500"
    :/Follow/i.test(s)?"bg-amber-100 text-amber-700":"bg-slate-100 text-slate-600";
  return <span className={"px-2 py-0.5 rounded-full text-xs "+color}>{s}</span>;
}

// Editable lead grade: tap A (green) / B (yellow) / C (orange); tap the active one again to clear.
// Saves a letter to the lead's Internal Rating column, so the grade filters and sorting pick it up.
function PriorityRating({lead,refresh,notify,label}){
  const [busy,setBusy]=useState(false);
  const [val,setVal]=useState(gradeOf(lead));
  useEffect(function(){ setVal(gradeOf(lead)); },[lead.ID,lead["Internal Rating"]]);
  async function set(g){
    if(busy) return;
    const next = g===val ? "" : g;
    const prev=val;
    setVal(next);
    setBusy(true);
    const res=await apiPost({action:"upsert", lead:{ID:lead.ID, "Internal Rating": next}});
    setBusy(false);
    if(res.ok){ notify(next?("Grade "+next):"Grade cleared"); refreshLight(); }
    else { notify("Failed: "+(res.error||"")); setVal(prev); }
  }
  return (
    <div className="flex items-center gap-1">
      {label && <span className="text-[11px] text-slate-500 mr-1">{label}</span>}
      {GRADES.map(function(g){
        return <button key={g.k} disabled={busy} onClick={()=>set(g.k)} title={"Grade "+g.k+" - "+g.name}
          className={"w-7 h-7 rounded-full text-xs font-bold border disabled:opacity-40 "+(val===g.k?g.chip:g.idle)}>{g.k}</button>;
      })}
    </div>
  );
}
/* ================== ARCHIVE (hide whole niches, restore any time) ================== */
function ArchiveSection({leads,refresh,notify}){
  const KEEP="interior designer";
  const [busy,setBusy]=useState("");
  const [tick,setTick]=useState(0);
  const groups={};
  leads.forEach(function(l){
    const f=String(l.Folder||"").trim()||"(no niche)";
    const g=groups[f]||(groups[f]={name:f,ids:[],worked:0,active:0});
    g.ids.push(l.ID);
    const st=String(l.Status||"New");
    if(st.toLowerCase()!=="new") g.worked++;
    if(/booked/i.test(st) || /^(interested|website sent|landed)$/i.test(st.trim())) g.active++;
  });
  const list=Object.keys(groups).map(function(k){ return groups[k]; }).sort(function(a,b){ return b.ids.length-a.ids.length; });
  const keep=list.filter(function(g){ return g.name.toLowerCase()===KEEP; });
  const rest=list.filter(function(g){ return g.name.toLowerCase()!==KEEP; });
  const restIds=[].concat.apply([],rest.map(function(g){ return g.ids; })).filter(Boolean);
  async function archive(groupsToArchive,label){
    const ids=[].concat.apply([],groupsToArchive.map(function(g){ return g.ids; })).filter(Boolean);
    if(!ids.length) return;
    const active=groupsToArchive.reduce(function(a,g){ return a+g.active; },0);
    const msg="Archive "+ids.length+" lead"+(ids.length>1?"s":"")+" ("+label+")?\n\n"
      +"They disappear from every list, count, intern queue and reminder."
      +(active?("\n"+active+" of them are booked / interested / website-sent / landed. Booked meetings are taken off your calendar."):"")
      +"\nNothing is deleted: restore them any time from this tab.";
    if(!confirm(msg)) return;
    setBusy(label);
    await archiveLeadsApi(ids,"buried","Archived: not an interior designer lead",refresh,notify);
    setBusy(""); setTick(function(t){ return t+1; });
  }
  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl border border-slate-200 p-4 space-y-3">
        <div>
          <div className="font-semibold">Archive by niche</div>
          <div className="text-xs text-slate-500">Hide leads you are not working right now. They vanish from every list, count and queue (and the site loads faster); restore any time below.</div>
        </div>
        {rest.length===0
          ? <div className="text-sm text-slate-500">Every active lead is already in the {keep.length?keep[0].name:"main"} niche. Nothing to archive.</div>
          : <div className="overflow-x-auto no-scrollbar">
              <table className="w-full text-sm">
                <thead className="text-slate-500 text-left"><tr><th className="py-1 pr-3">Niche</th><th className="py-1 px-2">Leads</th><th className="py-1 px-2">Worked</th><th className="py-1 px-2">Booked / warm</th><th className="py-1 px-2"></th></tr></thead>
                <tbody>
                  {keep.map(function(g){ return (
                    <tr key={g.name} className="border-t border-slate-100 text-slate-400"><td className="py-2 pr-3 font-medium">{g.name} <span className="text-[11px]">(kept)</span></td><td className="px-2">{g.ids.length}</td><td className="px-2">{g.worked}</td><td className="px-2">{g.active}</td><td></td></tr>); })}
                  {rest.map(function(g){ return (
                    <tr key={g.name} className="border-t border-slate-100">
                      <td className="py-2 pr-3 font-medium">{g.name}</td><td className="px-2">{g.ids.length}</td><td className="px-2">{g.worked}</td><td className="px-2">{g.active}</td>
                      <td className="px-2 text-right"><button disabled={!!busy} onClick={()=>archive([g],g.name)} className="px-3 py-1 rounded-lg bg-slate-800 text-white text-xs disabled:opacity-40">{busy===g.name?"Archiving\u2026":"Archive "+g.ids.length}</button></td>
                    </tr>); })}
                </tbody>
              </table>
            </div>}
        {rest.length>0 &&
          <button disabled={!!busy} onClick={()=>archive(rest,"everything except Interior Designer")} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium disabled:opacity-40">
            {busy?"Archiving\u2026":"Archive everything except Interior Designer ("+restIds.length+")"}</button>}
      </div>
      <ArchivePanel key={tick} kind="buried" refresh={refresh} notify={notify}/>
    </div>
  );
}

/* ================== RECYCLE BIN / BURIED ================== */
function ArchivePanel({kind,refresh,notify}){
  const [rows,setRows]=useState(null);
  const [sel,setSel]=useState({});
  const [q,setQ]=useState("");
  const [busy,setBusy]=useState(false);
  const isBin=kind==="bin";
  async function load(){
    const res=await apiPost({action:"listArchived"});
    if(res&&res.ok){ setRows((res.leads||[]).filter(function(l){ return l["Archive State"]===kind; })); setSel({}); }
    else { setRows([]); const e=(res&&res.error)||"error"; notify("Could not load: "+e+(/unknown action/i.test(e)?" (the backend needs the latest deploy)":"")); }
  }
  useEffect(function(){ load(); },[kind]);
  const needle=q.trim().toLowerCase();
  const shown=(rows||[]).filter(function(l){
    if(!needle) return true;
    return [l.Clinic,l.Name,l.Phone,l.City,l.Folder,l["Assigned To"],l.Status].join(" ").toLowerCase().indexOf(needle)>=0;
  });
  const ids=shown.map(function(l){ return l.ID; }).filter(Boolean);
  const selIds=ids.filter(function(id){ return sel[id]; });
  const allOn=ids.length>0 && selIds.length===ids.length;
  function toggle(id){ setSel(function(s){ return Object.assign({},s,{[id]:!s[id]}); }); }
  function toggleAll(){ if(allOn){ setSel({}); } else { const o={}; ids.forEach(function(id){ o[id]=true; }); setSel(o); } }
  async function restore(list){
    if(!list.length) return;
    const note=prompt("Optional note for the team (added to each lead's notes):","");
    if(note===null) return;
    setBusy(true);
    const res=await apiPost({action:"restore", ids:list, note:note.trim()});
    setBusy(false);
    if(res&&res.ok){ notify("Restored "+(res.restored!=null?res.restored:list.length)+" \u2014 back with their owners"); await load(); refresh(); }
    else notify("Failed: "+((res&&res.error)||"error"));
  }
  async function purge(list){
    if(!list.length) return;
    if(!confirm("Delete "+list.length+" lead"+(list.length>1?"s":"")+" FOREVER? This cannot be undone.")) return;
    if(list.length>=5){ const t=prompt("Type DELETE to confirm deleting "+list.length+" leads forever"); if(t!=="DELETE"){ notify("Cancelled"); return; } }
    setBusy(true);
    const res=await apiPost({action:"deleteMany", ids:list});
    setBusy(false);
    if(res&&res.ok){ notify("Deleted forever: "+(res.deleted!=null?res.deleted:list.length)); await load(); }
    else notify("Failed: "+((res&&res.error)||"error"));
  }
  return (
    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <div className="px-4 py-3 border-b flex flex-wrap items-center gap-3">
        <div>
          <div className="font-semibold">{isBin?"\uD83D\uDDD1 Recycle bin":"Archived leads"} {rows?("("+rows.length+")"):""}</div>
          <div className="text-xs text-slate-500">{isBin?"Deleted leads wait here. Restore sends a lead back to the same team member with a note; Delete forever removes it for good.":"Hidden from every list, count, queue and reminder. Restore any time."}</div>
        </div>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search..." className="ml-auto border rounded-lg px-3 py-1.5 text-sm"/>
        <button onClick={load} disabled={busy} className="px-3 py-1.5 rounded-lg bg-slate-100 text-sm">{"\u21BB Reload"}</button>
      </div>
      {selIds.length>0 &&
        <div className="px-4 py-2 bg-indigo-50 border-b flex items-center gap-3 text-sm flex-wrap">
          <b>{selIds.length} selected</b>
          <button disabled={busy} onClick={()=>restore(selIds)} className="px-3 py-1 rounded-lg bg-emerald-600 text-white disabled:opacity-50">{busy?"Working\u2026":"Restore selected"}</button>
          <button disabled={busy} onClick={()=>purge(selIds)} className="px-3 py-1 rounded-lg bg-red-600 text-white disabled:opacity-50">Delete forever</button>
          <button disabled={busy} onClick={()=>setSel({})} className="text-slate-500">Clear</button>
        </div>}
      {rows===null && <div className="px-4 py-6 text-sm text-slate-400">{"Loading\u2026"}</div>}
      {rows!==null && shown.length===0 && <div className="px-4 py-6 text-sm text-slate-400">{isBin?"The recycle bin is empty.":"Nothing archived yet."}</div>}
      {shown.length>0 &&
        <div className="overflow-x-auto no-scrollbar max-h-[70vh] overflow-y-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-left sticky top-0"><tr>
              <th className="px-3 py-2"><input type="checkbox" checked={allOn} onChange={toggleAll}/></th>
              <th className="px-3 py-2">Clinic / Name</th><th className="px-3 py-2">Niche</th><th className="px-3 py-2">City</th>
              <th className="px-3 py-2">Was with</th><th className="px-3 py-2">Status</th><th className="px-3 py-2">Moved on</th><th className="px-3 py-2"></th></tr></thead>
            <tbody>
              {shown.map(function(l,i){ return (
                <tr key={l.ID||i} className={"border-t border-slate-100 "+(sel[l.ID]?"bg-indigo-50":"")}>
                  <td className="px-3 py-2"><input type="checkbox" checked={!!sel[l.ID]} onChange={()=>toggle(l.ID)}/></td>
                  <td className="px-3 py-2 font-medium">{l.Clinic||l.Name}{l.Clinic&&l.Name?<div className="text-xs text-slate-400">{l.Name}</div>:null}{l["Archive Note"]?<div className="text-[11px] text-slate-400">{l["Archive Note"]}</div>:null}</td>
                  <td className="px-3 py-2">{l.Folder||"\u2014"}</td>
                  <td className="px-3 py-2">{l.City}</td>
                  <td className="px-3 py-2">{l["Assigned To"]||"\u2014"}</td>
                  <td className="px-3 py-2"><StatusBadge status={l.Status}/></td>
                  <td className="px-3 py-2 text-xs text-slate-500 whitespace-nowrap">{l["Archived At"]}</td>
                  <td className="px-3 py-2 whitespace-nowrap">
                    <button disabled={busy} onClick={()=>restore([l.ID])} className="text-emerald-600 text-xs border border-emerald-200 rounded px-1.5 py-0.5 mr-1 disabled:opacity-40">Restore</button>
                    <button disabled={busy} onClick={()=>purge([l.ID])} className="text-red-500 text-xs border border-red-200 rounded px-1.5 py-0.5 disabled:opacity-40">Delete forever</button>
                  </td>
                </tr>); })}
            </tbody>
          </table>
        </div>}
    </div>
  );
}

// Compute the funnel LIVE from the leads' current statuses so the numbers are
// always consistent with the buckets you can see (no drift-prone counters).
function funnelStats(leads){
  const has=function(re){ return leads.filter(function(l){ return re.test(String(l.Status||"New").trim()); }).length; };
  const total=leads.length;
  const isNew=leads.filter(function(l){ const s=String(l.Status||"").trim(); return !s || /^new$/i.test(s); }).length;
  const interested=has(/^interested$/i), notInt=has(/^not interested$/i);
  const booked=has(/^meeting booked$/i), followup=has(/^schedule follow-up$/i);
  const noShow=has(/^no show$/i), landed=has(/^landed$/i), website=has(/^website sent$/i);
  const contacted=total-isNew;                                   // worked at least once
  const meetings=booked+noShow+landed;                           // reached the meeting stage
  const convos=interested+notInt+booked+followup+noShow+landed+website;  // actually spoke to them
  return { assigned:total, contacted:contacted, convos:convos, meetings:meetings, followups:followup, landed:landed,
    bookingRate: contacted?meetings/contacted*100:0, closeRate: meetings?landed/meetings*100:0 };
}

/* ================== INTERN ================== */
function statusOf(l){ return String(l.Status||"New"); }
function statusRank(l){ const r=STATUS_RANK[statusOf(l).toLowerCase()]; return r===undefined?9:r; }
// "Fresh today" = still needs work AND not already touched today (so contacted
// leads drop off until tomorrow). Ordered New-first by the Smart sort.
function isFresh(l){
  const s=statusOf(l).toLowerCase();
  const inSet=FRESH_STATUSES.some(function(u){ return u.toLowerCase()===s; });
  return inSet && String(l["Last Follow-up Date"]||"").indexOf(todayISO())<0;
}

// Intern-facing CSV upload. Leads land straight in THIS intern's queue (Assigned To = them)
// and stay visible to admin. Optional folder tags where the batch is from.
function InternUpload({user,refresh,notify}){
  const [open,setOpen]=useState(false);
  const [folder,setFolder]=useState("");
  const [busy,setBusy]=useState(false);
  const [report,setReport]=useState(null);
  const fileRef=useRef();
  async function onFile(e){
    const f=e.target.files[0]; if(!f) return;
    const text=await f.text();

    if(!parsed.length){ notify("No valid rows found in that CSV"); fileRef.current.value=""; return; }
    setBusy(true);
    const res=await apiPost({action:"bulkImport", leads:parsed});
    setBusy(false); fileRef.current.value="";
    if(res.ok){ setReport({imported:res.imported, skipped:res.skipped}); notify("Uploaded "+res.imported+" leads to your queue"); refresh(); }
    else notify("Upload failed: "+(res.error||""));
  }
  return (
    <div className="bg-white rounded-2xl border border-slate-200">
      <button onClick={()=>setOpen(o=>!o)} className="w-full flex items-center justify-between px-4 py-2.5 text-sm font-medium text-slate-700">
        <span>⬆️ Upload my leads</span><span className="text-slate-400">{open?"▲":"▼"}</span>

}

function InternView({user,leads,stats,refresh,notify,actor}){
  const [mode,setMode]=useState("call");
  const [showScript,setShowScript]=useState(false);   // phones only; the script is always shown on wide screens
  const [splitW,setSplitW]=useSplitWidth();
  const splitRef=useRef(null);
  const [sel,setSel]=useState(["fresh"]);        // multi-select: ["fresh"] | ["all"] | [status,...]
  const [fday,setFday]=useState("");             // "worked on" date (yyyy-mm-dd)
  const [cat,setCat]=useState(function(){ try{ return localStorage.getItem("reactivify.cat."+user)||"All"; }catch(e){ return "All"; } });  // Category (Folder) filter — persisted per user
  useEffect(function(){ try{ localStorage.setItem("reactivify.cat."+user, cat); }catch(e){} },[cat,user]);
  const [city,setCity]=useState(function(){ try{ return localStorage.getItem("reactivify.city."+user)||"All"; }catch(e){ return "All"; } });  // City filter — persisted per user
  useEffect(function(){ try{ localStorage.setItem("reactivify.city."+user, city); }catch(e){} },[city,user]);
  const [gradeSel,setGradeSel]=useState([]);        // [] = every grade; else any mix of A / B / C / none
  const mine=useMemo(()=>leads.filter(l=>String(l["Assigned To"]||"").trim().toLowerCase()===String(user).toLowerCase()),[leads,user]);
  // Category counts (from each lead's tag) so school / physio / Australia stay separate in the dialing queue.
  const categories=useMemo(function(){ const set={}; mine.forEach(function(l){ const f=String(l.Folder||"").trim(); if(f) set[f]=(set[f]||0)+1; }); return Object.keys(set).sort().map(function(k){ return [k,set[k]]; }); },[mine]);
  useEffect(function(){ if(cat!=="All" && !categories.some(function(c){ return c[0]===cat; })) setCat("All"); },[categories]);  // saved category gone → fall back to All
  const cities=useMemo(function(){ const set={}; mine.forEach(function(l){ const c=cityGroup(l.City); if(c) set[c]=(set[c]||0)+1; }); return Object.keys(set).sort().map(function(k){ return [k,set[k]]; }); },[mine]);
  useEffect(function(){ if(city!=="All" && !cities.some(function(c){ return c[0]===city; })) setCity("All"); },[cities]);
  const mineCat=useMemo(function(){ return mine.filter(function(l){
    if(cat!=="All" && String(l.Folder||"").trim()!==cat) return false;
    if(city!=="All" && cityGroup(l.City)!==city) return false;
    if(gradeSel.length && gradeSel.indexOf(gradeOf(l)||"none")<0) return false;
    return true;
  }); },[mine,cat,city,gradeSel]);
  // Toggle a status chip. "fresh"/"all" are exclusive; individual statuses stack (union).
  function toggleChip(tok){
    setFday("");
    if(tok==="fresh"||tok==="all"){ setSel([tok]); return; }
    setSel(function(cur){
      let base=cur.filter(function(x){ return x!=="fresh"&&x!=="all"; });
      base = base.indexOf(tok)>=0 ? base.filter(function(x){ return x!==tok; }) : base.concat([tok]);
      return base.length? base : ["all"];
    });
  }

  const filtered=useMemo(function(){
    if(fday) return mineCat.filter(function(l){ return String(l["Last Follow-up Date"]||"").indexOf(fday)>=0; });
    if(sel.indexOf("fresh")>=0) return mineCat.filter(isFresh);
    if(sel.length===0 || sel.indexOf("all")>=0) return mineCat;
    const set=sel.map(function(s){ return s.toLowerCase(); });
    return mineCat.filter(function(l){ return set.indexOf(statusOf(l).toLowerCase())>=0; });
  },[mineCat,sel,fday]);

  const [sortBy,setSortBy]=useState("smart");   // ✨ New-first daily order by default
  const sorted=useMemo(function(){ return sortLeads(filtered, sortBy); },[filtered,sortBy]);

  const [idx,setIdx]=useState(0);
  useEffect(()=>{ setIdx(0); },[sel,fday,mode,sortBy,cat,city,gradeSel]);
  // A filter tap can shrink the list before the reset below runs; clamp so we never
  // render a lead that doesn't exist (that crash was the blank white page).
  const safeIdx=Math.min(idx, Math.max(0, sorted.length-1));
  const active=sorted[safeIdx];
  // "Next" after a save: if the saved lead left this filter, the next lead has already slid
  // into its place, so stay put; otherwise step one forward. (Stepping blindly skipped a lead.)
  const [advFrom,setAdvFrom]=useState(null);
  useEffect(function(){
    if(advFrom==null) return;
    const i=sorted.findIndex(function(l){ return l.ID===advFrom; });
    if(i>=0) setIdx(Math.min(sorted.length-1,i+1));
    setAdvFrom(null);
  },[advFrom,sorted]);
  useEffect(()=>{ setIdx(function(i){ return i>=sorted.length ? Math.max(0,sorted.length-1) : i; }); },[sorted.length]);  // functional, so a filter change's reset to 0 wins

  const myStats=useMemo(()=>funnelStats(mineCat),[mineCat]);
  const dueCount=useMemo(()=>pipelineEvents(mineCat).filter(e=>e.when.getTime()<=Date.now()).length,[mineCat]);
  // Live "calls I made today" counter — refetched whenever leads refresh (i.e. after each logged call).
  const [callsToday,setCallsToday]=useState(null);
  useEffect(function(){ apiGet("getDailyCalls").then(function(r){ if(r&&r.ok){ const day=todayISO(); const d=r.daily&&r.daily[day]&&r.daily[day][user]; setCallsToday(d?(d.calls||0):0); } }).catch(function(){}); },[user,leads]);
  const emptyMsg = fday ? "No leads worked on that date." : (sel.indexOf("fresh")>=0 ? "All caught up for today. 🎉 Fresh leads reset tomorrow — or pick another filter above." : "No leads in this filter.");

  return (
    <div ref={splitRef} className="p-4 max-w-2xl lg:max-w-none mx-auto flex flex-col lg:flex-row lg:items-start gap-4 lg:gap-0" style={{"--splitw":splitW+"px"}}>
    <div className="space-y-4 w-full lg:w-[var(--splitw)] lg:max-w-[calc(100%_-_20rem)] lg:shrink-0 min-w-0">
      <GameHUD user={user}/>
      <button onClick={()=>setShowScript(!showScript)} className="lg:hidden w-full py-2 rounded-xl bg-white border border-slate-200 text-sm text-slate-700">📜 {showScript?"Hide":"Show"} call script</button>
      <div className="flex items-center justify-between">
        <StatsBar s={myStats} today={callsToday}/>
        <div className="flex gap-1 bg-slate-100 rounded-full p-1">
          <button onClick={()=>setMode("call")} className={"px-3 py-1 rounded-full text-sm "+(mode==="call"?"bg-white shadow":"")}>Call</button>
          <button onClick={()=>setMode("close")} className={"px-3 py-1 rounded-full text-sm "+(mode==="close"?"bg-white shadow":"")}>Close{dueCount>0?" ("+dueCount+")":""}</button>
          <button onClick={()=>setMode("board")} className={"px-3 py-1 rounded-full text-sm "+(mode==="board"?"bg-white shadow":"")}>🧭 Board</button>
          <button onClick={()=>setMode("list")} className={"px-3 py-1 rounded-full text-sm "+(mode==="list"?"bg-white shadow":"")}>List</button>
          <button onClick={()=>setMode("phone")} className={"px-3 py-1 rounded-full text-sm "+(mode==="phone"?"bg-white shadow":"")}>📱 Phone</button>
        </div>
      </div>
      <QuickSchedule leads={mine} user={user} refresh={refresh} notify={notify}/>
      <InternUpload user={user} refresh={refresh} notify={notify}/>
      {categories.length>0 &&
        <div className="flex items-center gap-1.5 flex-wrap bg-white rounded-xl border border-slate-200 px-3 py-2">
          <span className="text-xs text-slate-400 mr-1">📁 Niche:</span>
          <button onClick={()=>setCat("All")} className={"px-2.5 py-1 rounded-full text-xs "+(cat==="All"?"bg-slate-900 text-white":"bg-slate-100 text-slate-600")}>All ({mine.length})</button>
          {categories.map(function(c){ return <button key={c[0]} onClick={()=>setCat(c[0])} className={"px-2.5 py-1 rounded-full text-xs "+(cat===c[0]?"bg-purple-600 text-white":"bg-purple-50 text-purple-700 border border-purple-200")}>{c[0]} ({c[1]})</button>; })}
        </div>}
      {cities.length>0 &&
        <div className="flex items-center gap-1.5 flex-wrap bg-white rounded-xl border border-slate-200 px-3 py-2">
          <span className="text-xs text-slate-400 mr-1">📍 City:</span>
          <button onClick={()=>setCity("All")} className={"px-2.5 py-1 rounded-full text-xs "+(city==="All"?"bg-slate-900 text-white":"bg-slate-100 text-slate-600")}>All</button>
          {cities.map(function(c){ return <button key={c[0]} onClick={()=>setCity(c[0])} className={"px-2.5 py-1 rounded-full text-xs "+(city===c[0]?"bg-blue-600 text-white":"bg-blue-50 text-blue-700 border border-blue-200")}>{c[0]} ({c[1]})</button>; })}
        </div>}
      {mine.some(function(l){ return gradeOf(l); }) &&
        <div className="flex items-center gap-1.5 flex-wrap bg-white rounded-xl border border-slate-200 px-3 py-2">
          <span className="text-xs text-slate-400 mr-1">Grade:</span>
          {GRADES.map(function(g){
            const c=mine.filter(function(l){ return gradeOf(l)===g.k; }).length;
            const on=gradeSel.indexOf(g.k)>=0;
            return <button key={g.k} onClick={()=>setGradeSel(function(cur){ return cur.indexOf(g.k)>=0?cur.filter(function(x){ return x!==g.k; }):cur.concat([g.k]); })}
              className={"px-2.5 py-1 rounded-full text-xs border "+(on?g.chip:g.idle)}>{g.k} - {g.name} ({c})</button>;
          })}
          {(function(){ const c=mine.filter(function(l){ return !gradeOf(l); }).length; const on=gradeSel.indexOf("none")>=0;
            return <button onClick={()=>setGradeSel(function(cur){ return cur.indexOf("none")>=0?cur.filter(function(x){ return x!=="none"; }):cur.concat(["none"]); })}
              className={"px-2.5 py-1 rounded-full text-xs border "+(on?"bg-slate-700 text-white border-slate-700":"bg-slate-50 text-slate-600 border-slate-300")}>No grade ({c})</button>; })()}
          {gradeSel.length>0 && <button onClick={()=>setGradeSel([])} className="text-xs text-slate-500 underline">clear</button>}
        </div>}
      {mode!=="close" && mode!=="board" && <InternFilters mine={mineCat} sel={sel} toggleChip={toggleChip} fday={fday} setFday={setFday} sortBy={sortBy} setSortBy={setSortBy}/>}
      {mode==="board"
        ? <PipelineBoard leads={mine} refresh={refresh} notify={notify}/>
        : mode==="list"
        ? <InternList mine={sorted} refresh={refresh} notify={notify} actor={actor} user={user}/>
        : mode==="phone"
        ? <PhoneView mine={sorted}/>
        : mode==="close"
          ? <MeetingsPipeline leads={mineCat} refresh={refresh} notify={notify}/>
          : (sorted.length===0
              ? <div className="bg-white rounded-2xl border p-8 text-center text-slate-500">{emptyMsg}</div>
              : <CallCard key={active.ID} lead={active} user={user} actor={actor} position={safeIdx+1} total={sorted.length}
                  onPrev={()=>setIdx(Math.max(0,safeIdx-1))} onNext={()=>setAdvFrom(active.ID)}
                  onSaved={refresh} notify={notify}/>)}
    </div>
    <SplitDivider width={splitW} setWidth={setSplitW} containerRef={splitRef}/>
    <aside className={(showScript?"block":"hidden")+" order-first lg:order-none lg:block w-full lg:flex-1 lg:min-w-[18rem] lg:sticky lg:top-4"}>
      <ScriptPanel user={actor||user}/>
    </aside>
    </div>
  );
}

function InternListItem({l,refresh,notify,onEdit,actor,user}){
  const [pendingStatus,setPendingStatus]=useState(statusOf(l));
  const [note,setNote]=useState("");
  const [open,setOpen]=useState(false);
  const [saving,setSaving]=useState(false);
  const savingRef=useRef(false);
  const autoRef=useRef(null);
  const mu=mapsUrl(l);
  const ln=lastNote(l);
  const statusChanged = pendingStatus && pendingStatus!==statusOf(l);
  const dirty = statusChanged || !!note.trim();

  // Save status + note TOGETHER in one write. Won't fire on its own for a single
  // field — the user (or the both-filled autosave) triggers it.
  async function commit(){
    if(savingRef.current) return;
    if(!statusChanged && !note.trim()){ notify("Nothing to save"); return; }
    savingRef.current=true; setSaving(true);
    const patch={ID:l.ID};
    if(statusChanged) patch.Status=pendingStatus;
    if(note.trim()){ const entry="["+nowStamp()+(actor?(" · "+actor):"")+"] "+note.trim();
      const hist=String(l.Notes||"").trim(); patch.Notes=hist?(hist+"\n"+entry):entry; }
    const payload={action:"upsert", lead:patch};
    if(statusChanged) payload.logStat={intern:l["Assigned To"]||"", outcome:pendingStatus};
    saveInBackground(payload);
    savingRef.current=false; setSaving(false);
    setNote(""); setOpen(false); notify("Saved ✓");
  }
  // Safety-net autosave: only once BOTH a (changed) status AND a note are present.
  // Debounced so it doesn't fire mid-typing. Manual Save always works too.
  useEffect(()=>{
    clearTimeout(autoRef.current);
    if(statusChanged && note.trim() && !savingRef.current){
      autoRef.current=setTimeout(()=>{ commit(); }, 1500);
    }
    return ()=>clearTimeout(autoRef.current);
  },[pendingStatus,note]);
  return (
    <div className="border-t border-slate-100 p-3 first:border-0">
      <div className="flex items-start justify-between gap-2">
        <div className="min-w-0">
          <div className="font-medium text-sm truncate">{l.Clinic||l.Name}</div>
          <div className="text-[11px] text-slate-400 flex items-center gap-1.5 flex-wrap">
            <a href={"tel:"+digits(l.Phone)} className={"text-base font-bold tracking-wide "+((!l.Phone||String(l.Phone).trim()==="")?"text-red-400":"text-slate-800")}>{l.Phone||"— add number"}</a>
            {l.City && <span>· {l.City}</span>}
            {l.Reviews && <span className="text-slate-500 font-medium">· 💬 {l.Reviews}</span>}
            {l.Rating && <span>· ★ {l.Rating}</span>}
            <StatusBadge status={l.Status}/>
            <FolderBadge lead={l}/>
          </div>
        </div>
        <div className="flex items-center gap-1 shrink-0">
          {l.Phone && <a href={"tel:"+digits(l.Phone)} className="px-2 py-1 rounded-lg bg-green-50 text-green-700 text-xs">📞</a>}
          {mu && <a href={mu} target="_blank" rel="noopener" className="px-2 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs">📍 Map</a>}
          <button onClick={()=>onEdit(l)} className="px-2 py-1 rounded-lg text-slate-400 hover:text-indigo-600 text-sm">✎</button>
          {canDelete(user,actor) && <button onClick={()=>deleteToBin(l,user||l["Assigned To"]||"",actor,refresh,notify)} title="Delete (moves to the Recycle bin)" className="px-2 py-1 rounded-lg text-red-500 border border-red-200 text-xs hover:text-red-700">Delete</button>}
        </div>
      </div>
      <div className="mt-1.5 flex items-center gap-2 flex-wrap">
        <PriorityRating lead={l} refresh={refresh} notify={notify}/>
        <select value={pendingStatus} onChange={e=>setPendingStatus(e.target.value)} disabled={saving}
          className={"border rounded-lg px-2 py-1 text-xs bg-white font-medium "+(statusChanged?"border-indigo-400 ring-1 ring-indigo-200":"border-slate-300")}>
          {["New"].concat(OUTCOMES).map(o=><option key={o}>{o}</option>)}
        </select>
        {!open && <button onClick={()=>setOpen(true)} className="text-xs text-indigo-700 px-2 py-1 rounded-lg bg-indigo-50">📝 Note</button>}
        {dirty && <button onClick={commit} disabled={saving} className="text-xs px-3 py-1 rounded-lg bg-indigo-600 text-white disabled:opacity-40">{saving?"…":"Save"}</button>}
      </div>
      {ln && <div className="text-[11px] text-slate-500 mt-1 bg-slate-50 rounded px-2 py-1">📝 {ln}</div>}
      {open &&
        <div className="mt-2 flex gap-2">
          <input value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") commit(); }} placeholder="Type a note…" className="flex-1 border rounded-lg px-2 py-1 text-sm" autoFocus/>
          <button onClick={commit} disabled={saving||!dirty} className="px-3 py-1 rounded-lg bg-indigo-600 text-white text-sm disabled:opacity-40">{saving?"…":"Save"}</button>
          <button onClick={()=>{setOpen(false);setNote("");}} className="px-2 text-slate-400">✕</button>
        </div>}
      {statusChanged && !note.trim() && <div className="text-[10px] text-slate-400 mt-1">Status changed — add a note (auto-saves) or hit Save.</div>}
    </div>
  );
}

function CallCard({lead,user,actor,position,total,onPrev,onNext,onSaved,notify}){
  const [outcome,setOutcome]=useState("");
  const [note,setNote]=useState("");
  const [saving,setSaving]=useState(false);
  const [picker,setPicker]=useState(null);
  const [dt,setDt]=useState({date:todayISO(),time:"11:00"});

  const wa=waNumber(lead.Phone);
  const waMsg=encodeURIComponent(waDetailsMsg(lead));
  const waMeet=/booked/i.test(lead.Status||"")?waMeetingMsg(lead,actor||user):"";
  const notesHistory=String(lead.Notes||"").trim();
  const booked=/booked/i.test(lead.Status||"");
  const gcal=booked?gcalUrl(lead):"";

  async function save(extra, opts){
    opts=opts||{};
    setSaving(true);
    const patch={ID:lead.ID};
    const effOutcome = opts.outcome!==undefined ? opts.outcome : outcome;
    if(effOutcome) patch.Status=effOutcome;
    if(note.trim()){ const entry="["+nowStamp()+" · "+(actor||user)+"] "+note.trim();
      patch.Notes=notesHistory?(notesHistory+"\n"+entry):entry; patch["Last Follow-up Date"]=todayISO(); }
    Object.assign(patch,extra||{});
    const payload={action:"upsert", lead:patch};
    // count this as a logged call outcome (accurate cumulative stats)
    if(effOutcome && !opts.noStat) payload.logStat={intern:user, outcome:effOutcome};
    saveInBackground(payload);
    setSaving(false);
    notify(opts.msg||"Saved"); if(!opts.stay) onNext();
  }
  function confirmPicker(){
    // Open WhatsApp with the confirmation BEFORE moving on to the next lead
    // (must happen inside this click, or the browser blocks the new tab).
    if(picker==="meeting" && wa){
      const msg=waMeetingMsg(Object.assign({},lead,{"Meeting Date":dt.date,"Meeting Time":dt.time}), actor||user);
      if(msg) window.open(waLink(lead.Phone,msg),"_blank");
    }
    if(picker==="meeting") save({Status:"Meeting Booked","Meeting Date":dt.date,"Meeting Time":dt.time},{outcome:"Meeting Booked"});
    else if(picker==="followup") save({Status:"Schedule Follow-up","Followup Date":dt.date,"Followup Time":dt.time},{outcome:"Schedule Follow-up"});
    setPicker(null);
  }
  function onOutcomeChange(v){ setOutcome(v); if(v==="Meeting Booked") setPicker("meeting"); else if(v==="Schedule Follow-up") setPicker("followup"); }
  // Meeting WhatsApp button: already booked -> send the confirmation; not yet -> pick the time first.
  function waMeetingClick(){
    if(booked && waMeet){ window.open(waLink(lead.Phone,waMeet),"_blank"); return; }
    setOutcome("Meeting Booked"); setPicker("meeting");
  }
  function rescheduleMeeting(){ setDt({date:lead["Meeting Date"]||todayISO(), time:lead["Meeting Time"]||"11:00"}); setPicker("meeting"); }
  function cancelMeeting(){
    if(!confirm("Cancel this meeting? It will be removed from the calendar.")) return;
    save({Status:"Interested","Meeting Date":"","Meeting Time":""},{outcome:"", noStat:true, stay:true, msg:"Meeting cancelled"});
  }

  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
      <div className="flex items-center justify-between text-sm text-slate-400">
        <button onClick={onPrev} disabled={position<=1} className="disabled:opacity-30">← Prev</button>
        <span>{position} / {total}</span>
        <button onClick={onNext} disabled={position>=total} className="disabled:opacity-30">Next →</button>
      </div>
      <div>
        <div className="text-xl font-bold">{lead.Clinic||lead.Name}</div>
        {lead.Clinic&&lead.Name && <div className="text-slate-500">{lead.Name}</div>}
        <div className="text-sm text-slate-500 mt-1 flex flex-wrap gap-x-3">
          {lead.City && <span>📍 {lead.City}</span>}
          {lead.Rating && <span>★ {lead.Rating}</span>}
          {lead.Reviews && <span>{lead.Reviews} reviews</span>}
          <FolderBadge lead={lead}/>
        </div>
        <div className="mt-1"><WebsiteBadge lead={lead}/> <MapsLink lead={lead}/></div>
        <div className="text-sm text-slate-500">
          {lead["Conflict Flag"]==="true" && <span className="text-red-500">⚠ slot conflict</span>}
        </div>
      </div>
      <div className="grid grid-cols-2 gap-2">
        <a href={"tel:"+digits(lead.Phone)} className="text-center py-3 rounded-xl bg-green-600 text-white font-semibold">📞 Call</a>
        <a href={"mailto:"+(lead.Email||"")} className="text-center py-3 rounded-xl bg-slate-600 text-white font-semibold">✉ Email</a>
      </div>
      <div className="grid grid-cols-2 gap-2">
        <a href={"https://wa.me/"+wa+"?text="+waMsg} target="_blank" className="text-center py-3 rounded-xl bg-emerald-500 text-white font-semibold" title="Samples, prices and their rating/reviews">💬 WhatsApp: details</a>
        <button onClick={waMeetingClick} className="py-3 rounded-xl bg-emerald-700 text-white font-semibold" title={booked&&waMeet?"Sends the meeting confirmation with the Google Meet link":"Pick the meeting time; WhatsApp opens when you confirm"}>📅 WhatsApp: meeting</button>
      </div>
      <div className="text-center">
        <a href={"tel:"+digits(lead.Phone)} className="text-2xl font-bold text-slate-800 tracking-wider">{lead.Phone||"— no number"}</a>
        {lead.Email && <div className="text-xs text-slate-400 mt-0.5">{lead.Email}</div>}
      </div>
      {mapsUrl(lead) && <a href={mapsUrl(lead)} target="_blank" rel="noopener" className="block text-center text-sm text-blue-600">📍 Open in Google Maps</a>}
      <div className="flex items-center justify-center gap-1"><span className="text-[11px] text-slate-500">Grade:</span><PriorityRating lead={lead} refresh={onSaved} notify={notify}/></div>
      {canDelete(user,actor) && <div className="text-center"><button onClick={()=>deleteToBin(lead,user,actor,onSaved,notify)} className="text-xs text-red-500 border border-red-200 rounded-lg px-3 py-1 hover:text-red-700">🗑 Delete this lead</button></div>}

      {booked && lead["Meeting Date"] &&
        <div className="bg-green-50 rounded-xl p-3 text-sm space-y-2">
          <div className="flex items-center justify-between">
            <span>📅 Meeting: <b>{lead["Meeting Date"]} {lead["Meeting Time"]}</b></span>
            {gcal && <a href={gcal} target="_blank" className="px-2 py-1 rounded-lg bg-white border text-xs">Add to Calendar</a>}
          </div>
          <div className="flex gap-2">
            <button onClick={rescheduleMeeting} className="px-2 py-1 rounded-lg bg-white border text-xs">Reschedule</button>
            <button onClick={cancelMeeting} className="px-2 py-1 rounded-lg bg-white border text-xs text-red-600">Cancel meeting</button>
          </div>
        </div>}

      {lead.Recording &&
        <div className="bg-slate-50 rounded-xl p-3 space-y-1">
          <div className="text-xs font-semibold text-slate-400">Call recordings</div>
          {String(lead.Recording).split("\n").filter(Boolean).map((u,i)=><a key={i} href={u} target="_blank" className="block text-sm text-indigo-600">▶ Recording {i+1}</a>)}
        </div>}

      {notesHistory &&
        <div className="bg-slate-50 rounded-xl p-3 max-h-40 overflow-y-auto no-scrollbar">
          <div className="text-xs font-semibold text-slate-400 mb-1">Notes history</div>
          {notesHistory.split("\n").map((line,i)=><div key={i} className="text-sm text-slate-600 mb-1">{line}</div>)}
        </div>}

      <div className="space-y-2">
        <div className="flex gap-2">
          <button onClick={()=>save({Status:"Website Sent"},{outcome:"Website Sent",msg:"Website sent ✓",stay:true})} disabled={saving}
            className="flex-1 py-2 rounded-xl bg-cyan-600 text-white text-sm font-semibold disabled:opacity-40">🌐 Website sent</button>
        </div>
        <select value={outcome} onChange={e=>onOutcomeChange(e.target.value)} className="w-full border rounded-xl px-3 py-2">
          <option value="">— Select outcome —</option>{OUTCOMES.map(o=><option key={o}>{o}</option>)}</select>
        <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2} placeholder="Add a note (appended, never overwrites)…" className="w-full border rounded-xl px-3 py-2 text-sm"/>
      </div>

      {picker &&
        <div className="bg-indigo-50 rounded-xl p-3 space-y-2">
          <div className="text-sm font-semibold">{picker==="meeting"?"Book meeting":"Schedule follow-up"}</div>
          {picker==="meeting" && wa && <div className="text-xs text-indigo-700">On Confirm, WhatsApp opens with the meeting message and Meet link, then you move to the next lead.</div>}
          <div className="flex gap-2">
            <input type="date" value={dt.date} onChange={e=>setDt({...dt,date:e.target.value})} className="border rounded-lg px-2 py-1 text-sm flex-1"/>
            <input type="time" value={dt.time} onChange={e=>setDt({...dt,time:e.target.value})} className="border rounded-lg px-2 py-1 text-sm flex-1"/>
          </div>
          <div className="flex gap-2">
            <button onClick={confirmPicker} className="flex-1 py-2 rounded-lg bg-indigo-600 text-white text-sm">{picker==="meeting"&&wa?"Confirm & open WhatsApp":"Confirm"}</button>
            <button onClick={()=>{setPicker(null);setOutcome("");}} className="px-3 py-2 rounded-lg bg-white border text-sm">Cancel</button>
          </div>
        </div>}

      <button onClick={()=>save()} disabled={saving||(!outcome&&!note.trim())} className="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold disabled:opacity-40">
        {saving?"Saving…":"Save & Next →"}</button>
    </div>
  );
}

class AppErrorBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err:err}; }
  componentDidCatch(err){ try{ console.error(err); }catch(e){} }
  render(){
    if(!this.state.err) return this.props.children;
    return (
      <div className="min-h-screen flex items-center justify-center p-6">
        <div className="bg-white rounded-2xl border border-slate-200 p-6 max-w-sm text-center space-y-3">
          <div className="text-3xl">😵</div>
          <div className="font-semibold">Something went wrong on this screen</div>
          <div className="text-sm text-slate-500">Your saved calls are safe. Tap below to get back to work.</div>
          <button onClick={()=>this.setState({err:null})} className="w-full py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold">Try again</button>
          <button onClick={()=>location.reload()} className="w-full py-2 rounded-xl border text-sm">Reload page</button>
          <div className="text-[10px] text-slate-400 break-words">{String(this.state.err&&this.state.err.message||this.state.err)}</div>
        </div>
      </div>
    );
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<AppErrorBoundary><App/></AppErrorBoundary>);
</script>

<script>
  // Force Babel's CLASSIC JSX runtime (React.createElement) — the automatic
  // runtime emits `import` statements that break as an inline script.
  (function () {
    try {
      var src = document.getElementById("app-code").textContent;
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
      var s = document.createElement("script");
      s.textContent = out;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="padding:24px;font-family:sans-serif;color:#b91c1c">App failed to load: ' +
        (e && e.message ? e.message : e) + '</div>';
      console.error(e);
    }
  })();
</script>
</body>
</html>
