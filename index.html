<style>

  @keyframes rv-modal { from { opacity: 0; transform: translateY(24px) scale(.9); } to { opacity: 1; transform: none; } }

  @keyframes rv-shine { from { background-position: 200% 0, 0 0; } to { background-position: -200% 0, 0 0; } }

  select, input, textarea { transition: border-color .2s ease, box-shadow .2s ease; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129, 140, 248, .25); }

  @keyframes rv-spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

  .hero-rays { left: 50%; top: 50%; width: 170vmax; height: 170vmax; transform: translate(-50%,-50%); background: repeating-conic-gradient(from 0deg, rgba(251,191,36,.22) 0deg 9deg, transparent 9deg 18deg); -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 58%); mask-image: radial-gradient(circle, #000 0%, transparent 58%); animation: rv-spin 22s linear infinite; }

<body class="bg-slate-50 text-slate-800">
<div id="root"></div>

<script id="app-code" type="text/plain">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ================== CONFIG ================== */
// Requests go through the Cloudflare accelerator (cached reads, reliable writes).
// APPS_URL is the original Google backend; reads fall back to it if the accelerator is down.
const API_URL = "https://reactivifyapi.reactivify.workers.dev";
const APPS_URL = "https://script.google.com/macros/s/AKfycbw6_2z2rT-U2mmpFhRl8hysSYnxLqmyArFfZHUU9EnkbirL6wc4QchUs5rcXho28aOZVQ/exec";

const OUTCOMES = [
  "Not Answering","Owner Not Available","Interested","Website Sent","Not Interested",
  "Meeting Booked","Schedule Follow-up","Landed","No Show","Dumped"
];
// Statuses that still need work — shown in the daily queue. Ordered New-first
// (untouched leads at the top so interns don't scroll past yesterday's calls).
const FRESH_STATUSES = ["New","Not Answering","Schedule Follow-up","Owner Not Available","Interested","Website Sent"];
const STATUS_RANK = { "new":0, "not answering":1, "schedule follow-up":2, "owner not available":3, "interested":4, "website sent":5 };
// Statuses that mean a meeting/follow-up is CLOSED (out of the pending pipeline)
const CLOSED_STATUSES = ["Landed","No Show","Not Interested","Dumped"];
const CONVO_OUTCOMES = ["Interested","Not Interested","Website Sent","Landed"];
// Outcomes that DON'T count as a conversation (dialed but didn't really speak).
const NON_CONVO = ["Not Answering","Owner Not Available","Dr Not Available"];

// Intern goes "idle" after this long with no activity (mouse/keys/touch/scroll).
const IDLE_MS = 120000;   // 2 minutes

/* ================== API ================== */
// Time of this browser's last real write (from the Worker's clock when available).
// Sent with reads so a cached copy older than our own write is never served back to us.
let _lastWriteAt=0;
const NO_SYNC_ACTIONS={sessionPing:1,sessionStart:1,sessionEnd:1,deviceCheck:1,deviceStatus:1,adminAuth:1,reconcile:1,markNoRecording:1};
async function apiGet(action, extraQuery){
  const since=(_lastWriteAt && /^(list|bootstrap|getStats|getSessions|getDevices|getDailyCalls)$/.test(action)) ? ("&since="+_lastWriteAt) : "";
  const q = "?action=" + action + (extraQuery||"") + since;
  let r, j;
  try{ r = await fetch(API_URL + q); j = await r.json(); }catch(e){ j = null; }
  if(!j || (j.ok===false && /upstream/i.test(j.error||""))){ r = await fetch(APPS_URL + "?action=" + action + (extraQuery||"")); j = await r.json(); }
  if(j && typeof j==="object" && r.headers.get("x-cache")==="stale") j._stale=true;
  return j;
}
// Writes use a plain text/plain POST (a CORS "simple request", no preflight).
// Apps Script answers /exec with a 302 to googleusercontent, and that redirect
// occasionally returns WITHOUT the CORS header -> fetch throws "Failed to fetch"
// even though nothing was written. That single dropped request is what used to
// freeze Save. We retry (upserts are idempotent, keyed by ID) until we get a
// readable JSON response, which reliably means the row was written. This always
// RESOLVES (never hangs); on total failure it returns {ok:false} so the caller
// can show a retry state instead of a silent stuck spinner.
// Set once by App() so apiPost can optimistically update the shared leads list
// without every call site needing to know about it.
let _setLeadsRef = null;
function _optimisticPatch(payload, res){
  if(!_setLeadsRef || !res || res.ok===false) return;
  try{
    if(payload.action==="upsert" && res.lead && res.lead.ID){
      _setLeadsRef(function(cur){
        const i=cur.findIndex(function(l){ return String(l.ID)===String(res.lead.ID); });
        if(i<0) return cur.concat([res.lead]);
        const next=cur.slice(); next[i]=Object.assign({},cur[i],res.lead); return next;
      });
    } else if(payload.action==="delete" && payload.id){
      _setLeadsRef(function(cur){ return cur.filter(function(l){ return String(l.ID)!==String(payload.id); }); });
    } else if(payload.action==="bulkField" && Array.isArray(payload.rows) && payload.field){
      const rows=new Set(payload.rows);
      _setLeadsRef(function(cur){ return cur.map(function(l){ return rows.has(l._row) ? Object.assign({},l,{[payload.field]:payload.value}) : l; }); });
    }
  }catch(e){ /* best-effort only -- refresh() reconciles regardless */ }
}
function clearAdminKey(){ try{ sessionStorage.removeItem("reactivify.adminKey"); }catch(e){} }
function newOpId(){ try{ return crypto.randomUUID(); }catch(e){ return "op"+Date.now()+Math.random().toString(36).slice(2); } }
async function apiPost(payload){
  let adminKey=""; try{ adminKey=sessionStorage.getItem("reactivify.adminKey")||""; }catch(e){}
  const body = JSON.stringify(Object.assign({opId:newOpId()}, adminKey?{adminKey:adminKey}:{}, payload));
  let lastErr = null;
  for(let attempt=0; attempt<8; attempt++){
    try{
      const r = await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: body
      });
      const res = await r.json();       // readable response == write persisted
      if(!(res && res.ok===false) && !NO_SYNC_ACTIONS[payload.action]){ const wt=Number(r.headers.get("x-worker-time")); _lastWriteAt = wt>0 ? wt : Date.now(); }
      _optimisticPatch(payload, res);
      return res;
    }catch(e){
      lastErr = e;
      await new Promise(res=>setTimeout(res, 300*(attempt+1)));  // backoff, then retry
    }
  }
  return { ok:false, error:(lastErr && lastErr.message) || "network" };
}

/* ============ BACKGROUND SAVE QUEUE ============
   Lead saves return instantly: the screen updates and moves on, while the write is sent
   in the background (in order, with retries). Unsent saves survive a reload (localStorage). */
const OUTBOX_KEY="reactivify.outbox";
let _outbox=[]; try{ _outbox=JSON.parse(localStorage.getItem(OUTBOX_KEY)||"[]")||[]; }catch(e){ _outbox=[]; }
let _flushing=false, _outboxStuck=false, _needFull=false;
let _toastRef=null, _drainedLight=null, _drainedFull=null;
const _outboxSubs=[];
function _outboxNotify(){
  try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify(_outbox)); }catch(e){}
  _outboxSubs.forEach(function(f){ f({n:_outbox.length, flushing:_flushing, stuck:_outboxStuck}); });
}
function _patchFor(p){ const patch=Object.assign({},p.lead); if(p.logStat && p.logStat.outcome) patch["Last Follow-up Date"]=todayISO(); return patch; }
function _localPatch(p){
  if(!_setLeadsRef || !p || p.action!=="upsert" || !p.lead || !p.lead.ID) return;
  const patch=_patchFor(p);
  _setLeadsRef(function(cur){
    const i=cur.findIndex(function(l){ return String(l.ID)===String(patch.ID); });
    if(i<0) return cur;
    const next=cur.slice(); next[i]=Object.assign({},cur[i],patch); return next;
  });
}
// A refreshed list must not erase saves that are still waiting to be sent.
function applyPending(list){
  if(!_outbox.length) return list;
  const by={};
  _outbox.forEach(function(p){ if(p.action==="upsert" && p.lead && p.lead.ID) by[p.lead.ID]=Object.assign(by[p.lead.ID]||{}, _patchFor(p)); });
  return list.map(function(l){ return by[l.ID] ? Object.assign({},l,by[l.ID]) : l; });
}
function saveInBackground(payload){
  payload.opId = payload.opId || newOpId();
  _localPatch(payload);
  if(payload.logStat && payload.logStat.outcome) gameBump(payload.logStat.intern, payload.logStat.outcome, payload.opId);
  _outbox.push(payload); _outboxStuck=false; _outboxNotify();
  flushOutbox();
}
async function flushOutbox(){
  if(_flushing) return;
  _flushing=true; _outboxStuck=false; _outboxNotify();
  let fails=0;
  while(_outbox.length){
    const p=_outbox[0];
    const res=await apiPost(p);
    if(res && res.ok!==false){
      _outbox.shift(); fails=0; gameConfirm(p.opId);
      if(p.lead && (p.lead["Meeting Date"] || /booked/i.test(p.lead.Status||""))) _needFull=true;
      _outbox.forEach(function(q){ if(q.action==="upsert" && q.lead && p.lead && q.lead.ID===p.lead.ID) _localPatch(q); });
      _outboxNotify(); continue;
    }
    const err=(res && res.error) || "";
    if(/unauthorized|unknown action/i.test(err)){ _outbox.shift(); _outboxNotify(); if(_toastRef) _toastRef("A save was rejected: "+err); continue; }
    fails++;
    if(fails>=5){ _outboxStuck=true; break; }
    await new Promise(function(r){ setTimeout(r, 2000*fails); });
  }
  _flushing=false; _outboxNotify();
  if(!_outbox.length){
    gameLoad(true);
    try{ if(_needFull){ _needFull=false; if(_drainedFull) _drainedFull(); } else if(_drainedLight) _drainedLight(); }catch(e){}
  }
}
// Move leads to the Recycle bin (or "buried"): they vanish from every list right away,
// and can be restored from the Bin tab. Nothing is deleted.
async function archiveLeadsApi(ids,state,note,refresh,notify){
  if(_setLeadsRef){ const rm=new Set(ids); _setLeadsRef(function(cur){ return cur.filter(function(l){ return !rm.has(l.ID); }); }); }
  const res=await apiPost({action:"archive", ids:ids, state:state, note:note||""});
  if(res && res.ok){ notify((state==="buried"?"Archived ":"Moved to bin: ")+(res.archived!=null?res.archived:ids.length)); }
  else {
    const err=(res&&res.error)||"error";
    notify("Failed: "+err+(/unknown action/i.test(err)?" (the backend needs the latest deploy)":""));
    refresh();
  }
  return res;
}
function SyncBadge(){
  const [st,setSt]=useState({n:_outbox.length, flushing:_flushing, stuck:_outboxStuck});
  useEffect(function(){ _outboxSubs.push(setSt); return function(){ const i=_outboxSubs.indexOf(setSt); if(i>=0) _outboxSubs.splice(i,1); }; },[]);
  if(!st.n) return null;
  return (
    <div className={"fixed bottom-3 right-3 z-50 text-xs px-3 py-2 rounded-xl shadow-lg text-white "+(st.stuck?"bg-red-600":"bg-slate-800")}>
      {st.stuck ? <span>{st.n} unsaved <button onClick={flushOutbox} className="underline ml-1 font-semibold">Retry</button></span> : <span>Saving {st.n}{"…"}</span>}
    </div>
  );
}

/* ================== GAMIFICATION ==================
   Everything here is computed from the per-day call log (getDailyCalls), the same data
   as "Calls per day", so points always match real logged work. No extra backend. */
const GAME_GOAL = 30;   // dials per day for the goal ring and streaks
const GAME_PTS = { dial:1, convo:3, web:5, meet:15, showed:20, landed:50 };
const LEVELS = [
  {n:1, name:"Rookie",    min:0,    icon:"🌱"},
  {n:2, name:"Dialer",    min:100,  icon:"📞"},
  {n:3, name:"Connector", min:300,  icon:"🔗"},
  {n:4, name:"Pitcher",   min:700,  icon:"🎯"},
  {n:5, name:"Closer",    min:1500, icon:"🤝"},
  {n:6, name:"Rainmaker", min:3000, icon:"💰"},
  {n:7, name:"Legend",    min:6000, icon:"👑"}
];
const BADGES = [
  {id:"first",   icon:"🚀", name:"Lift-off",      desc:"Log your first call",                    test:function(g){ return g.total.dials>=1; }},
  {id:"goal",    icon:"🎯", name:"Goal Getter",   desc:"Hit the daily goal ("+GAME_GOAL+" dials)", test:function(g){ return g.best.dials>=GAME_GOAL; }},
  {id:"d50",     icon:"💯", name:"Half Century",  desc:"50 dials in one day",                    test:function(g){ return g.best.dials>=50; }},
  {id:"talk10",  icon:"💬", name:"Smooth Talker", desc:"10 conversations in one day",            test:function(g){ return g.best.convos>=10; }},
  {id:"web5",    icon:"🌐", name:"Show & Tell",   desc:"Send 5 websites in one day",             test:function(g){ return g.best.web>=5; }},
  {id:"meet1",   icon:"📅", name:"Door Opener",   desc:"Book your first meeting",                test:function(g){ return g.total.meet>=1; }},
  {id:"hat",     icon:"🎩", name:"Hat-trick",     desc:"3 meetings booked in one day",           test:function(g){ return g.best.meet>=3; }},
  {id:"show1",   icon:"🤩", name:"Showtime",      desc:"A booked client shows up",               test:function(g){ return g.total.showed>=1; }},
  {id:"close1",  icon:"🏆", name:"Closer",        desc:"Land your first client",                 test:function(g){ return g.total.landed>=1; }},
  {id:"streak3", icon:"🔥", name:"On Fire",       desc:"3-day goal streak",                      test:function(g){ return g.maxStreak>=3; }},
  {id:"streak7", icon:"⚡", name:"Unstoppable",   desc:"7-day goal streak",                      test:function(g){ return g.maxStreak>=7; }},
  {id:"pts1000", icon:"💎", name:"Thousand Club", desc:"Earn 1,000 points",                      test:function(g){ return g.points>=1000; }}
];
const G_KEYS = ["dials","convos","web","meet","showed","landed","points"];

function gIso(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function gZero(){ return {dials:0,convos:0,web:0,meet:0,showed:0,landed:0,points:0}; }
function gAdd(a,b){ const o={}; G_KEYS.forEach(function(k){ o[k]=(a[k]||0)+(b[k]||0); }); return o; }
function gRec(dayObj,name){
  if(!dayObj || !name) return null;
  const k=String(name).trim().toLowerCase();
  for(const key in dayObj){ if(String(key).trim().toLowerCase()===k) return dayObj[key]; }
  return null;
}
function gRecStats(rec){
  const n=function(k){ return (rec && rec[k]) || 0; };
  const showed=n("Showed Up");
  const dials=Math.max(0, ((rec && rec.calls) || 0) - n("Dumped") - showed);
  const convos=Math.max(0, dials - n("Not Answering"));
  const web=n("Website Sent"), meet=n("Meeting Booked"), landed=n("Landed");
  const points=dials*GAME_PTS.dial + convos*GAME_PTS.convo + web*GAME_PTS.web + meet*GAME_PTS.meet + showed*GAME_PTS.showed + landed*GAME_PTS.landed;
  return {dials:dials,convos:convos,web:web,meet:meet,showed:showed,landed:landed,points:points};
}
function levelFor(points){
  let cur=LEVELS[0];
  LEVELS.forEach(function(l){ if(points>=l.min) cur=l; });
  const next=LEVELS.find(function(l){ return l.min>points; }) || null;
  return {cur:cur, next:next, pct: next ? Math.min(100, Math.round((points-cur.min)/(next.min-cur.min)*100)) : 100};
}
function personGame(daily,name){
  const days=Object.keys(daily||{}).sort();
  const today=todayISO();
  const wk=new Date(); wk.setDate(wk.getDate()-6);
  const wkIso=gIso(wk), monIso=today.slice(0,8)+"01";
  let total=gZero(), best=gZero(), week=gZero(), month=gZero(), todayS=gZero();
  const dialsBy={};
  days.forEach(function(d){
    const s=gRecStats(gRec(daily[d],name));
    dialsBy[d]=s.dials;
    total=gAdd(total,s);
    G_KEYS.forEach(function(k){ if(s[k]>best[k]) best[k]=s[k]; });
    if(d>=wkIso && d<=today) week=gAdd(week,s);
    if(d>=monIso && d<=today) month=gAdd(month,s);
    if(d===today) todayS=s;
  });
  // Streak = consecutive working days (Sundays skipped) hitting the goal. Today joins once it is hit.
  const met=function(iso){ return (dialsBy[iso]||0)>=GAME_GOAL; };
  let streak=0;
  if(met(today)) streak++;
  const c=new Date(); c.setDate(c.getDate()-1);
  for(let i=0;i<150;i++){
    if(c.getDay()===0){ c.setDate(c.getDate()-1); continue; }
    if(met(gIso(c))){ streak++; c.setDate(c.getDate()-1); } else break;
  }
  let maxStreak=0, run=0;
  if(days.length){
    const s=new Date(days[0]+"T00:00:00"), e=new Date();
    for(let i=0;i<400 && s<=e;i++){
      if(s.getDay()!==0){ const iso=gIso(s); if(met(iso)){ run++; if(run>maxStreak) maxStreak=run; } else if(iso!==today) run=0; }
      s.setDate(s.getDate()+1);
    }
  }
  const g={name:name,total:total,best:best,week:week,month:month,today:todayS,points:total.points,streak:streak,maxStreak:Math.max(maxStreak,streak)};
  g.level=levelFor(g.points);
  g.badges=BADGES.filter(function(b){ return b.test(g); }).map(function(b){ return b.id; });
  return g;
}

// ---- shared live store: server call log + this browser's not-yet-confirmed saves ----
let _gDaily=null, _gVer=0, _gLoading=false, _gLastLoad=0, _gAgain=false, _gameTeam=[];
const _gPending=[];
const _gSubs=[];
function _gEmit(){ _gVer++; _gSubs.slice().forEach(function(f){ try{ f(_gVer); }catch(e){} }); }
function gameLoad(force){
  // A forced reload asked for while one is already running must still happen afterwards,
  // otherwise a just-confirmed call would be counted twice until the next poll.
  if(_gLoading){ if(force) _gAgain=true; return; }
  if(!force && Date.now()-_gLastLoad<5000) return;
  _gLoading=true;
  const started=Date.now();
  apiGet("getDailyCalls").then(function(r){
    if(r && r.ok){
      _gDaily=r.daily||{}; _gLastLoad=Date.now();
      try{ teamHypeCheck(); }catch(e){}
      for(let i=_gPending.length-1;i>=0;i--){ const b=_gPending[i]; if(b.confirmedAt && b.confirmedAt<started) _gPending.splice(i,1); }
      _gEmit();
    }
  }).catch(function(){}).then(function(){
    _gLoading=false;
    if(_gAgain){ _gAgain=false; gameLoad(true); }
  });
}
function gameDaily(){
  if(!_gDaily && !_gPending.length) return null;
  const base=_gDaily||{};
  if(!_gPending.length) return base;
  const out={};
  Object.keys(base).forEach(function(d){ out[d]=Object.assign({},base[d]); });
  _gPending.forEach(function(b){
    const day=out[b.day]=Object.assign({}, out[b.day]||{});
    let key=b.intern;
    Object.keys(day).forEach(function(k){ if(k.toLowerCase()===String(b.intern).toLowerCase()) key=k; });
    const rec=Object.assign({calls:0}, day[key]||{});
    rec.calls=(rec.calls||0)+1;
    rec[b.outcome]=(rec[b.outcome]||0)+1;
    day[key]=rec;
  });
  return out;
}

const _conf={parts:[], running:false, canvas:null};
function runConfetti(cv,power){
  if(!cv) return;
  try{ if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; }catch(e){}
  _conf.canvas=cv;
  const W=window.innerWidth, H=window.innerHeight;
  const colors=["#6366f1","#a855f7","#ec4899","#f59e0b","#10b981","#06b6d4","#facc15"];
  const n=Math.round(110*(power||1));
  for(let i=0;i<n;i++){
    const fromLeft=i%2===0;
    _conf.parts.push({
      x: fromLeft ? W*0.15 : W*0.85, y: H*0.75,
      vx: (fromLeft?1:-1)*(Math.random()*9+3), vy: -(Math.random()*16+9),
      g: 0.33+Math.random()*0.1, w: 6+Math.random()*6, h: 9+Math.random()*7,
      r: Math.random()*6.28, vr: (Math.random()-0.5)*0.4, c: colors[i%colors.length], born: performance.now()
    });
  }
  if(_conf.running) return;
  _conf.running=true;
  let last=performance.now();
  const frame=function(t){
    const c=_conf.canvas; const dpr=window.devicePixelRatio||1;
    const w=window.innerWidth, h=window.innerHeight;
    if(c.width!==Math.round(w*dpr) || c.height!==Math.round(h*dpr)){ c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); }
    const ctx=c.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    const k=Math.min(2,(t-last)/16.7); last=t;
    _conf.parts=_conf.parts.filter(function(p){ return p.y<h+60 && t-p.born<3200; });
    _conf.parts.forEach(function(p){
      p.vy+=p.g*k; p.vx*=Math.pow(0.985,k); p.x+=p.vx*k; p.y+=p.vy*k; p.r+=p.vr*k;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(0, Math.min(1, 1-(t-p.born-2200)/1000));
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3))+1.5);
      ctx.restore();
    });
    if(_conf.parts.length) requestAnimationFrame(frame); else { ctx.clearRect(0,0,w,h); _conf.running=false; }
  };

}

function useCountUp(v,ms){
  const [d,setD]=useState(v);
  const from=useRef(v);
  useEffect(function(){
    const a=from.current, b=v;
    if(a===b){ setD(b); return; }
    const t0=performance.now(); let raf;
    const step=function(t){
      const k=Math.min(1,(t-t0)/(ms||800)); const e=1-Math.pow(1-k,3);
      setD(Math.round(a+(b-a)*e));
      if(k<1) raf=requestAnimationFrame(step); else from.current=b;
    };
    raf=requestAnimationFrame(step);
    return function(){ cancelAnimationFrame(raf); from.current=b; };
  },[v]);
  return d;
}
function GoalRing({value,goal,size}){
  size=size||104;
  const stroke=10, r=(size-stroke)/2, C=2*Math.PI*r;
  const [shown,setShown]=useState(0);
  useEffect(function(){ const id=setTimeout(function(){ setShown(value||0); },60); return function(){ clearTimeout(id); }; },[value]);
  const pct=Math.min(1,(shown||0)/goal), done=(value||0)>=goal;
  const num=useCountUp(value||0);
  return (
    <div className="relative shrink-0" style={{width:size,height:size}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,0.22)" strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={done?"#fde047":"#ffffff"} strokeWidth={stroke} fill="none" strokeLinecap="round"
          strokeDasharray={C} strokeDashoffset={C*(1-pct)} style={{transition:"stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1), stroke .4s"}}/>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center leading-none">
        <div className="text-3xl font-extrabold tabular-nums">{num}</div>
        <div className="text-[10px] opacity-80 mt-1">{done?"goal hit! 🎯":("of "+goal+" dials")}</div>
      </div>
    </div>
  );
}

const SPLIT_KEY = "reactivify.splitW";
const SPLIT_DEFAULT = 672;   // the old fixed width of the queue column (42rem)
function useSplitWidth(){
  const [w,setW]=useState(function(){ try{ return Number(localStorage.getItem(SPLIT_KEY))||SPLIT_DEFAULT; }catch(e){ return SPLIT_DEFAULT; } });
  useEffect(function(){ try{ localStorage.setItem(SPLIT_KEY, String(Math.round(w))); }catch(e){} },[w]);
  return [w,setW];
}
function SplitDivider({width,setWidth,containerRef}){
  const [drag,setDrag]=useState(false);
  function down(e){
    e.preventDefault();
    const startX=e.clientX, startW=width;
    const box=containerRef.current ? containerRef.current.getBoundingClientRect().width : window.innerWidth;
    setDrag(true);
    document.body.style.cursor="col-resize"; document.body.style.userSelect="none";
    function move(ev){ setWidth(Math.max(380, Math.min(box-300, startW+ev.clientX-startX))); }
    function up(){
      setDrag(false); document.body.style.cursor=""; document.body.style.userSelect="";
      window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
    }
    window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
  }
  function key(e){
    if(e.key==="ArrowLeft"){ e.preventDefault(); setWidth(Math.max(380,width-40)); }
    if(e.key==="ArrowRight"){ e.preventDefault(); setWidth(width+40); }
  }
  return (
    <div onPointerDown={down} onDoubleClick={()=>setWidth(SPLIT_DEFAULT)} onKeyDown={key} tabIndex={0} role="separator" aria-orientation="vertical"
      title="Drag to resize · double-click to reset" className="hidden lg:block self-stretch w-5 shrink-0 cursor-col-resize relative group outline-none">
      <div className={"absolute inset-y-0 left-1/2 -translate-x-1/2 w-px transition-colors "+(drag?"bg-indigo-500":"bg-slate-200 group-hover:bg-indigo-300")}></div>
      <div className={"sticky top-[45vh] mx-auto w-2 h-12 rounded-full transition-colors "+(drag?"bg-indigo-500":"bg-slate-300 group-hover:bg-indigo-400")}></div>
    </div>
  );
}

/* ============ CALL SCRIPT (one shared script, stored in the Cloudflare Worker) ============ */
const SCRIPT_URL = API_URL + "/script";
const SCRIPT_LOCAL = "reactivify.script";
function readLocalScript(){ try{ return JSON.parse(localStorage.getItem(SCRIPT_LOCAL)||"null"); }catch(e){ return null; } }
function ScriptPanel({user}){
  const [text,setText]=useState(function(){ const d=readLocalScript(); return d&&typeof d.text==="string"?d.text:""; });
  const [saved,setSaved]=useState(null);   // the text as last saved (null = nothing saved yet)
  const [meta,setMeta]=useState(null);     // {by, at} of the cloud copy
  const [st,setSt]=useState("loading");    // loading | ready | saving | local | error
  const [size,setSize]=useState(function(){ try{ return Number(localStorage.getItem("reactivify.scriptSize"))||15; }catch(e){ return 15; } });
  useEffect(function(){ try{ localStorage.setItem("reactivify.scriptSize", String(size)); }catch(e){} },[size]);
  const textRef=useRef(text); textRef.current=text;
  useEffect(function(){
    let dead=false;
    fetch(SCRIPT_URL).then(function(r){ return r.ok?r.json():null; }).then(function(r){
      if(dead) return;
      if(r && r.ok && typeof r.text==="string"){
        const local=readLocalScript();
        // An unsaved draft on this device that is newer than the cloud copy is kept.
        if(local && local.text && local.text!==r.text && (local.dirty||!r.text) && (local.at||0)>(r.at||0)){ setSaved(r.text); setText(local.text); }
        else { setText(r.text); setSaved(r.text); }
        setMeta({by:r.by, at:r.at}); setSt("ready");
      } else { const local=readLocalScript(); setSaved(local&&!local.dirty?local.text:null); setSt("local"); }
    }).catch(function(){ if(!dead) setSt("local"); });
    return function(){ dead=true; };
  },[]);
  const dirty = saved===null ? !!text : text!==saved;
  useEffect(function(){ if(st==="loading") return; try{ localStorage.setItem(SCRIPT_LOCAL, JSON.stringify({text:text, at:Date.now(), dirty:dirty})); }catch(e){} },[text]);
  useEffect(function(){
    if(!dirty) return;
    function warn(e){ e.preventDefault(); e.returnValue=""; }
    window.addEventListener("beforeunload", warn);
    return function(){ window.removeEventListener("beforeunload", warn); };
  },[dirty]);
  async function save(){
    const t=textRef.current;
    if(st==="local"){ setSaved(t); try{ localStorage.setItem(SCRIPT_LOCAL, JSON.stringify({text:t,at:Date.now(),dirty:false})); }catch(e){} return; }
    setSt("saving");
    try{
      const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({text:t,by:user})}).then(function(x){ return x.json(); });
      if(r&&r.ok){ setSaved(t); setMeta({by:r.by,at:r.at}); setSt("ready"); try{ localStorage.setItem(SCRIPT_LOCAL, JSON.stringify({text:t,at:Date.now(),dirty:false})); }catch(e){} }
      else setSt("error");
    }catch(e){ setSt("error"); }
  }
  const when = meta&&meta.at ? new Date(meta.at).toLocaleString([], {day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}) : "";
  const status = st==="loading" ? "Loading…"
    : st==="saving" ? "Saving…"
    : st==="error" ? "Couldn't save, try again"
    : dirty ? "Unsaved changes"
    : st==="local" ? "Saved on this device"
    : when ? "Saved"+(meta.by?" by "+meta.by:"")+" · "+when : "Saved";
  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col lg:h-[calc(100vh-6rem)]">
      <div className="flex items-center justify-between gap-2 mb-2">
        <div className="font-semibold">📜 Call script</div>
        <div className="flex items-center gap-1">
          <button onClick={()=>setSize(Math.max(12,size-1))} className="w-8 h-8 rounded-lg bg-slate-100 text-xs text-slate-600" title="Smaller text">A-</button>
          <button onClick={()=>setSize(Math.min(24,size+1))} className="w-8 h-8 rounded-lg bg-slate-100 text-sm text-slate-600" title="Bigger text">A+</button>
          <button onClick={save} disabled={!dirty||st==="saving"||st==="loading"} className="px-4 h-8 rounded-lg bg-indigo-600 text-white text-sm font-semibold disabled:opacity-40">Save</button>
        </div>
      </div>
      <textarea value={text} onChange={e=>setText(e.target.value)} disabled={st==="loading"}
        onKeyDown={e=>{ if((e.ctrlKey||e.metaKey)&&(e.key==="s"||e.key==="S")){ e.preventDefault(); if(dirty) save(); } }}
        placeholder={"Write your full call script here.\n\nOpening…\nPitch…\nObjections…\nClose…"}
        style={{fontSize:size+"px", lineHeight:1.6}}
        className="flex-1 min-h-[60vh] lg:min-h-0 w-full border border-slate-200 rounded-xl px-3 py-2 resize-y lg:resize-none text-slate-800"/>
      <div className={"text-[11px] mt-2 "+(st==="error"?"text-red-500":dirty?"text-amber-600":"text-slate-400")}>{status} · Ctrl+S saves · the whole team sees this script</div>
    </div>
  );
}

/* ================== CSV ================== */
function parseCSV(text){
  const rows=[]; let cur=[], field="", inQ=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inQ){ if(c==='"'&&text[i+1]==='"'){field+='"';i++;} else if(c==='"'){inQ=false;} else field+=c; }
    else { if(c==='"')inQ=true; else if(c===","){cur.push(field);field="";}
      else if(c==="\n"){cur.push(field);rows.push(cur);cur=[];field="";}
      else if(c==="\r"){} else field+=c; } }
  if(field.length||cur.length){cur.push(field);rows.push(cur);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
function normHeader(h){ return String(h).toLowerCase().replace(/[_\s]+/g,""); }
function mapHeaders(headers){
  const map={};
  headers.forEach((h,i)=>{ const n=normHeader(h);
    if(["practicename","title","name","businessname","companyname"].includes(n)) map.name=i;
    else if(["ownerorcontactname","ownername","contactname"].includes(n)) map.owner=i;
    else if(["phone","phonenumber","mobile","contact"].includes(n)) map.phone=i;
    else if(["email","emailaddress","publicemail"].includes(n)) map.email=i;
    else if(["city","locality","area","address"].includes(n)&&map.city===undefined) map.city=i;
    else if(["rating","stars","score","ratingstars"].includes(n)) map.rating=i;
    else if(["reviews","reviewscount","reviewcount","totalreviews","reviewsnumber","no.ofratings","noofratings","numberofratings","ratingscount"].includes(n)) map.reviews=i;
    else if(["clinic","clinicname"].includes(n)) map.clinic=i;
    else if(["grade","leadgrade","abc","abcgrade","abcclass","leadclass","leadtype","leadquality","internalrating","leadrating","tier"].includes(n)) map.grade=i;
    else if(n==="website"||n==="websiteurl") map.website=i;
    else if(n==="websitequality") map.webq=i;
    else if(["sourceurl","mapsurl","googlemapsurl","maplink"].includes(n)) map.src=i; });
  return map;
}
function csvToLeads(text, cityOverride, folderOverride){
  const rows=parseCSV(text); if(rows.length<2) return [];
  const m=mapHeaders(rows[0]);
  return rows.slice(1).map(r=>({
    Name: (m.owner!==undefined&&String(r[m.owner]||"").trim())?r[m.owner]:(m.name!==undefined?r[m.name]:""),
    Clinic: m.clinic!==undefined?r[m.clinic]:(m.name!==undefined?r[m.name]:""),
    Phone: m.phone!==undefined?(function(p){ const c=String(p||"").replace(/[\s\-().]/g,""); return /^0\d{10}$/.test(c)?c.slice(1):p; })(r[m.phone]):"",
    Email: m.email!==undefined?r[m.email]:"",
    City: cityOverride || (m.city!==undefined?r[m.city]:""),
    Rating: m.rating!==undefined?r[m.rating]:"",
    Reviews: m.reviews!==undefined?r[m.reviews]:"",
    Folder: (folderOverride||"").trim(),
    "Internal Rating": m.grade!==undefined?gradeLetter(r[m.grade]):"",
    Website: m.website!==undefined?String(r[m.website]||"").trim():"",
    "Website Quality": m.webq!==undefined?String(r[m.webq]||"").trim():"",
    Status:"New"
  })).filter(l=>l.Name||l.Phone);
}

// Parse a lead's date + time into a local Date (handles YYYY-MM-DD + "18:00"/"6:00 PM")
function leadDateTime(dateVal, timeVal){
  if(!dateVal) return null;
  let d;
  const md=String(dateVal).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(md) d=new Date(+md[1], +md[2]-1, +md[3]); else { d=new Date(dateVal); if(isNaN(d)) return null; }
  let hh=0,mm=0;
  if(timeVal){ const m=String(timeVal).match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
    if(m){ hh=+m[1]; mm=+m[2]; const ap=(m[3]||"").toUpperCase();
      if(ap==="PM"&&hh<12)hh+=12; if(ap==="AM"&&hh===12)hh=0; } }
  d.setHours(hh,mm,0,0); return d;
}

// All upcoming meetings + follow-ups from a set of leads, soonest first.
function upcomingEvents(leads){
  const now=Date.now(); const out=[];
  leads.forEach(l=>{
    if(/booked/i.test(l.Status||"")){
      const at=leadDateTime(l["Meeting Date"], l["Meeting Time"]);
      if(at && at.getTime()>now-60*60000) out.push({when:at,type:"Meeting",lead:l});

  });

}

/* ================== NOTIFICATIONS ================== */
function useNotifier(events){
  const fired = useRef({});
  useEffect(()=>{
    if(!("Notification" in window)) return;
    const id=setInterval(()=>{
      if(Notification.permission!=="granted") return;
      const now=Date.now();
      events.forEach(ev=>{
        const mins=(ev.when.getTime()-now)/60000;
        [30,15].forEach(th=>{
          const key=ev.lead.ID+"_"+ev.type+"_"+th;
          if(mins<=th && mins>th-2 && !fired.current[key]){
            fired.current[key]=true;
            try{ new Notification("Reactivify — "+ev.type+" soon", {
              body:(ev.lead.Clinic||ev.lead.Name||"Lead")+" in ~"+Math.max(1,Math.round(mins))+" min" }); }catch(e){}
          }
        });
      });
    }, 60000);
    return ()=>clearInterval(id);
  }, [events]);
}

/* ================== WORK SESSION (clock-in / idle / logout) ==================
 * Tracks an intern's shift: they clock in on login, we watch for 2 min of
 * inactivity (idle), they resume by tapping "Back to dialing", and we clock
 * them out on logout. Per-second counters live in refs (no re-render); only
 * the phase (working/idle) is React state. The backend just records the
 * timestamps so the admin can see who was online when.
 * ========================================================================== */
function useWorkSession(user, enabled){
  const sidRef = useRef(null);
  const [phase,setPhase] = useState("pending");      // pending | working | idle
  const phaseRef = useRef("pending");
  const workRef = useRef(0), idleRef = useRef(0);
  const lastActRef = useRef(Date.now());
  useEffect(()=>{ phaseRef.current = phase; },[phase]);

  // Reset everything when the session is disabled (admin / logged out).
  useEffect(()=>{
    if(!enabled){ sidRef.current=null; workRef.current=0; idleRef.current=0; lastActRef.current=Date.now(); setPhase("pending"); }
  },[enabled,user]);

  const start = useCallback(async ()=>{
    const sid = "S"+Date.now()+"_"+Math.floor(Math.random()*1000);
    sidRef.current = sid;
    workRef.current=0; idleRef.current=0; lastActRef.current=Date.now();
    setPhase("working");
    try{ await apiPost({action:"sessionStart", sid, intern:user}); }catch(e){}
  },[user]);

  const resume = useCallback(async ()=>{
    lastActRef.current=Date.now();
    setPhase("working");
    try{ await apiPost({action:"sessionPing", sid:sidRef.current, intern:user, status:"Working", workSec:workRef.current, idleSec:idleRef.current}); }catch(e){}
  },[user]);

  const end = useCallback(async (extra)=>{
    try{ await apiPost(Object.assign({action:"sessionEnd", sid:sidRef.current, intern:user, workSec:workRef.current, idleSec:idleRef.current}, extra||{})); }catch(e){}
  },[user]);

  // Activity resets the idle timer — but ONLY while working. Once idle, the
  // intern must explicitly tap "Back to dialing" (activity alone won't resume).
  useEffect(()=>{
    if(!enabled) return;
    const onAct=()=>{ if(phaseRef.current==="working") lastActRef.current=Date.now(); };
    const evs=["mousedown","keydown","touchstart","pointerdown","scroll"];
    evs.forEach(e=>window.addEventListener(e,onAct,{passive:true}));
    return ()=>evs.forEach(e=>window.removeEventListener(e,onAct));
  },[enabled]);

  // 1-second heartbeat: accumulate work/idle seconds (refs, no re-render) and
  // flip to idle after IDLE_MS of no activity.
  useEffect(()=>{
    if(!enabled) return;
    const id=setInterval(()=>{
      const p=phaseRef.current;
      if(p==="working"){ workRef.current++; if(Date.now()-lastActRef.current>IDLE_MS) setPhase("idle"); }
      else if(p==="idle"){ idleRef.current++; }
    },1000);
    return ()=>clearInterval(id);
  },[enabled]);

  // Tell the server the moment we flip to idle.
  useEffect(()=>{
    if(!enabled || !sidRef.current) return;
    if(phase==="idle"){ apiPost({action:"sessionPing", sid:sidRef.current, intern:user, status:"Idle", workSec:workRef.current, idleSec:idleRef.current}).catch(()=>{}); }
  },[phase]);

  // 60s heartbeat so the admin dashboard sees a live "last active".
  useEffect(()=>{
    if(!enabled) return;
    const id=setInterval(()=>{
      if(!sidRef.current) return;
      apiPost({action:"sessionPing", sid:sidRef.current, intern:user, status: phaseRef.current==="idle"?"Idle":"Working", workSec:workRef.current, idleSec:idleRef.current}).catch(()=>{});
    },120000);
    return ()=>clearInterval(id);
  },[enabled,user]);

  return { phase, start, resume, end, workRef, idleRef };
}

function App(){
  const [user,setUser]=useState(null);
  const [adminAuthed,setAdminAuthed]=useState(false);
  const [leads,setLeads]=useState([]);
  _setLeadsRef = setLeads;
  const [interns,setInterns]=useState(()=>{ try{ const c=localStorage.getItem("reactivify_interns"); return c?JSON.parse(c):[]; }catch(e){ return []; } });
  _gameTeam = interns;
  const [stats,setStats]=useState({});
  const [sessions,setSessions]=useState([]);
  const [devices,setDevices]=useState([]);
  const [deviceOk,setDeviceOk]=useState(false);     // this browser cleared the intern gate
  const [loading,setLoading]=useState(false);
  const [toast,setToast]=useState("");
  const [logoutOpen,setLogoutOpen]=useState(false);
  const [notifPerm,setNotifPerm]=useState(("Notification" in window)?Notification.permission:"unsupported");

  const configMissing = API_URL.indexOf("PASTE_YOUR")===0;
  const notify=(m)=>{ setToast(m); setTimeout(()=>setToast(""),2800); };

  // Intern work-session (clock-in / idle / logout). Inert for admin & logged-out.
  const session = useWorkSession(user||"", !!user && user!=="Team");

  const refreshLight=useCallback(async()=>{
    if(configMissing) return;
    const tasks = [
      apiGet("getStats").then(function(st){ if(st.ok) setStats(st.stats||{}); }),
      apiGet("getSessions").then(function(se){ if(se.ok) setSessions(se.sessions||[]); }),
      apiGet("getDevices").then(function(dv){ if(dv && dv.ok) setDevices(dv.devices||[]); })
    ].map(function(p){ return p.catch(function(e){ notify("Load failed: "+e); }); });
    await Promise.all(tasks);
  },[configMissing]);
  const refresh=useCallback(async()=>{
    if(configMissing) return;
    setLoading(true);
    // Interns only ever look at their own leads -- ask the server for just
    // those instead of downloading everyone's and filtering here. Admin
    // ("Team") still needs the full picture, so it keeps fetching everything.
    const internOnly = user && user!=="Team";
    const listQuery = internOnly ? ("&assignedTo="+encodeURIComponent(user)) : "";
    // Speed: fire all four loads in parallel AND apply each as it lands, instead of
    // waiting on Promise.all -- stats/sessions/devices are small and usually land
    // in well under a second; the leads list is the one that can take much longer
    // at this lead count, and there's no reason the other three should wait on it.
    // If the server answered from a slightly old cached copy, quietly re-fetch twice
    // (the fresh copy is being prepared in the background) so the screen catches up.
    const loadList = function(attempt){
      return apiGet("list", listQuery).then(function(l){ if(l.ok){ setLeads(applyPending(l.leads||[])); setInterns(l.interns||[]);
        try{ localStorage.setItem("reactivify_interns", JSON.stringify(l.interns||[])); }catch(e){}
        if(l._stale && attempt<2) setTimeout(function(){ loadList(attempt+1).catch(function(){}); },15000); } });
    };
    const tasks = [
      loadList(0),
      apiGet("getStats").then(function(st){ if(st.ok) setStats(st.stats||{}); }),
      apiGet("getSessions").then(function(se){ if(se.ok) setSessions(se.sessions||[]); }),
      apiGet("getDevices").then(function(dv){ if(dv && dv.ok) setDevices(dv.devices||[]); })
    ].map(function(p){ return p.catch(function(e){ notify("Load failed: "+e); }); });
    await Promise.all(tasks);
    setLoading(false);
  },[configMissing,user]);

  useEffect(()=>{ if(user) refresh(); },[user,refresh]);
  useEffect(()=>{ _toastRef=notify; _drainedLight=refreshLight; _drainedFull=refresh; },[refresh,refreshLight]);
  useEffect(()=>{
    if(_outbox.length) flushOutbox();
    const h=function(e){ if(_outbox.length){ e.preventDefault(); e.returnValue=""; } };
    window.addEventListener("beforeunload",h);
    return ()=>window.removeEventListener("beforeunload",h);
  },[]);
  // Re-run the device gate on every login/switch (admin is exempt in render).
  useEffect(()=>{ setDeviceOk(false); },[user]);
  // keep data fresh so countdowns/notifications stay accurate. Pause polling when
  // the tab is hidden (big battery/CPU win on phones) and use a lighter cadence.
  useEffect(()=>{ if(!user) return;
    const id=setInterval(()=>{ if(!document.hidden) refresh(); },600000);
    return ()=>clearInterval(id); },[user,refresh]);

  function askNotif(){
    if(!("Notification" in window)) return;
    Notification.requestPermission().then(p=>setNotifPerm(p));
  }
  useEffect(()=>{ if(user && notifPerm==="default") askNotif(); },[user]);

  async function finishLogout(summary){
    await session.end(Object.assign({reconciled:true}, summary||{}));
    setLogoutOpen(false);
    setUser(null);
  }

  if(!user) return <Login interns={interns} onPick={setUser} onNeedInterns={refresh} configMissing={configMissing}/>;

  const isAdmin = user==="Team";

  // Admin panel is password-protected.
  if(isAdmin && !adminAuthed)
    return <AdminGate onOk={()=>setAdminAuthed(true)} onCancel={()=>{ clearAdminKey(); setUser(null); }}/>;

  // Interns: this browser/device must be approved by an admin before they can
  // reach their queue. Admin is exempt (handled above by the password).
  if(!isAdmin && !deviceOk)
    return <DeviceGate user={user} onApproved={()=>setDeviceOk(true)} onCancel={()=>setUser(null)}/>;

  // Interns must clock in before they get their queue.
  if(!isAdmin && session.phase==="pending")
    return <StartShift user={user} onStart={session.start} onCancel={()=>setUser(null)}/>;

  const myLeads = isAdmin ? leads : leads.filter(l=>String(l["Assigned To"]||"").trim().toLowerCase()===String(user).toLowerCase());
  const events = upcomingEvents(myLeads);

  return (
    <div className="min-h-screen">
      <SyncBadge/>
      <GameFX/>
      <AdminKeyPrompt/>
      <Header user={user} isAdmin={isAdmin} session={session}
        onSwitch={()=>{ if(isAdmin){ clearAdminKey(); setAdminAuthed(false); setUser(null); } else setLogoutOpen(true); }} onRefresh={refresh}
        loading={loading} notifPerm={notifPerm} onEnableNotif={askNotif}/>
      {loading && leads.length===0 &&
        <div className="bg-indigo-50 text-indigo-700 text-sm px-4 py-2 text-center">Loading your leads, this can take up to a minute the first time -- nothing has been deleted.</div>}
      {configMissing &&
        <div className="bg-amber-100 text-amber-900 text-sm px-4 py-2 text-center">⚠ API_URL not set.</div>}
      <NotifierMount events={events}/>
      <CountdownPill events={events}/>
      {isAdmin
        ? <AdminView leads={leads} interns={interns} stats={stats} sessions={sessions} devices={devices} refresh={refresh} notify={notify}/>
        : <InternView user={user} leads={leads} stats={stats} refresh={refresh} notify={notify}/>}
      {!isAdmin && session.phase==="idle" &&
        <IdleOverlay session={session} onResume={session.resume} onLogout={()=>setLogoutOpen(true)}/>}
      {logoutOpen &&
        <LogoutModal user={user} onCancel={()=>setLogoutOpen(false)} onLoggedOut={finishLogout} notify={notify}/>}
      {toast && <Toast msg={toast}/>}
    </div>
  );
}
function NotifierMount({events}){ useNotifier(events); return null; }

function Toast({msg}){ return <div key={msg} className="rv-toast fixed bottom-4 left-1/2 bg-slate-900/95 text-white text-sm px-4 py-2 rounded-full shadow-xl z-50" style={{transform:"translateX(-50%)"}}>{msg}</div>; }

/* ================== WORK STATUS BADGE ================== */
function WorkStatusBadge({session}){
  const [,setTick]=useState(0);
  useEffect(()=>{ const id=setInterval(()=>setTick(t=>t+1),1000); return ()=>clearInterval(id); },[]);
  if(!session || session.phase==="pending") return null;
  const working=session.phase==="working";
  return (
    <span className={"flex items-center gap-1.5 text-xs px-2 py-0.5 rounded-full "+(working?"bg-green-100 text-green-700":"bg-amber-100 text-amber-700")}>
      <span className={"w-2 h-2 rounded-full "+(working?"bg-green-500 animate-pulse":"bg-amber-500")}></span>
      {working?"Dialing":"Idle"} · {fmtDur(session.workRef.current)}
    </span>
  );
}

        <button onClick={onRefresh} className="text-sm px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200">{loading?"…":"↻"}</button>

/* ================== START SHIFT (intern clock-in) ================== */

      <div className="text-3xl font-bold text-indigo-600 mb-1">Reactivify</div>

/* ================== LOGOUT RECONCILIATION ==================
 * Hard-blocks logout until every answered call from today either has a
 * recording (interns upload into their name/date Drive subfolder, then hit
 * re-check) or is marked "recording doesn't exist" with a written reason.
 * ========================================================================== */
function LogoutModal({user,onCancel,onLoggedOut,notify}){
  const [state,setState]=useState("checking");   // checking | result | error
  const [data,setData]=useState(null);
  const [reasonFor,setReasonFor]=useState(null);  // lead id currently being explained
  const [reason,setReason]=useState("");
  const [busy,setBusy]=useState(false);

  const runCheck=useCallback(async()=>{
    setState("checking");
    try{
      const res=await apiPost({action:"reconcile", intern:user});
      if(res.ok){ setData(res); setState("result"); }
      else { setData({error:res.error, missing:[], convos:0, recordings:0}); setState("error"); }
    }catch(e){ setData({error:String(e), missing:[], convos:0, recordings:0}); setState("error"); }
  },[user]);
  useEffect(()=>{ runCheck(); },[runCheck]);

  async function saveNoRecording(id){
    if(!reason.trim()){ notify("Please write a short reason first"); return; }
    setBusy(true);
    const res=await apiPost({action:"markNoRecording", id, reason:reason.trim(), intern:user});
    setBusy(false);
    if(res.ok){ setReasonFor(null); setReason(""); runCheck(); }
    else notify("Failed: "+(res.error||"try again"));
  }

  const missing = data ? (data.missing||[]) : [];
  const clear = state==="result" && missing.length===0;

  async function doLogout(){
    setBusy(true);
    await onLoggedOut({convos: data?data.convos:0, recordings: data?data.recordings:0,
      notes: data?("convos "+data.convos+" / recordings "+data.recordings):""});
    // parent unmounts this modal
  }

  return (
    <div className="fixed inset-0 bg-slate-900/70 flex items-center justify-center z-[70] p-4">
      <div className="bg-white rounded-3xl w-full max-w-md max-h-[88vh] overflow-y-auto no-scrollbar p-5 space-y-3 shadow-2xl">
        <div className="flex items-center justify-between">
          <div className="text-lg font-bold">Before you log out</div>
          <button onClick={onCancel} className="text-slate-400 text-xl leading-none">✕</button>
        </div>

        {state==="checking" &&
          <div className="py-10 text-center text-slate-500">
            <div className="text-4xl mb-3 animate-pulse">🔎</div>
            Checking your Drive recordings & matching today's calls…
          </div>}

        {state==="error" &&
          <div className="space-y-3">
            <div className="bg-red-50 text-red-700 text-sm rounded-xl p-3">⚠ {data&&data.error?data.error:"Check failed."}</div>
            <button onClick={runCheck} className="w-full py-2.5 rounded-xl bg-slate-100 text-sm">Try again</button>
          </div>}

        {(state==="result") && <React.Fragment>
          <div className="flex gap-2 text-center">
            <div className="flex-1 bg-slate-50 rounded-xl py-2">
              <div className="text-2xl font-bold">{data.convos}</div>
              <div className="text-[10px] uppercase text-slate-400">Answered calls today</div>
            </div>
            <div className="flex-1 bg-slate-50 rounded-xl py-2">
              <div className={"text-2xl font-bold "+(clear?"text-green-600":"text-amber-600")}>{data.recordings}</div>
              <div className="text-[10px] uppercase text-slate-400">Accounted for</div>
            </div>
            <div className="flex-1 bg-slate-50 rounded-xl py-2">
              <div className={"text-2xl font-bold "+(missing.length?"text-red-600":"text-green-600")}>{missing.length}</div>
              <div className="text-[10px] uppercase text-slate-400">Missing</div>
            </div>
          </div>

          {typeof data.unmatched==="number" && data.unmatched>0 &&
            <div className="text-[11px] text-amber-700 bg-amber-50 rounded-lg px-3 py-2">
              ⚠ {data.unmatched} recording file(s) in Drive didn't match any lead — check the phone number in the filename (misaligned upload).
            </div>}

          {clear
            ? <div className="bg-green-50 text-green-800 rounded-xl p-4 text-center text-sm">
                ✓ All of today's calls have a recording (or a logged reason). You're good to go.
              </div>
            : <div className="space-y-2">
                <div className="text-sm text-slate-600">These clinics had a call today but <b>no recording</b>. Upload the recording into your Drive folder and tap re-check, or mark that it doesn't exist:</div>
                <button onClick={runCheck} disabled={busy} className="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold disabled:opacity-40">🔁 I've uploaded — re-check</button>
                {missing.map(m=>(
                  <div key={m.id} className="border border-slate-200 rounded-xl p-3">
                    <div className="font-medium text-sm">{m.clinic}</div>
                    <div className="text-[11px] text-slate-400">{m.phone||"no phone"}{m.name?" · "+m.name:""}</div>
                    {reasonFor===m.id
                      ? <div className="mt-2 space-y-2">
                          <textarea value={reason} onChange={e=>setReason(e.target.value)} rows={2}
                            placeholder="Why is there no recording? (e.g. recorder didn't start, call dropped, wrong number…)"
                            className="w-full border rounded-lg px-3 py-2 text-sm"/>
                          <div className="flex gap-2">
                            <button onClick={()=>saveNoRecording(m.id)} disabled={busy} className="flex-1 py-2 rounded-lg bg-slate-800 text-white text-sm disabled:opacity-40">{busy?"Saving…":"Save reason"}</button>
                            <button onClick={()=>{setReasonFor(null);setReason("");}} className="px-3 py-2 rounded-lg bg-white border text-sm">Cancel</button>
                          </div>
                        </div>
                      : <button onClick={()=>{setReasonFor(m.id);setReason("");}} className="mt-2 text-xs px-3 py-1.5 rounded-lg bg-red-50 text-red-600">Recording doesn't exist →</button>}
                  </div>
                ))}
              </div>}

          <div className="flex gap-2 pt-1">
            <button onClick={doLogout} disabled={!clear||busy}
              className="flex-1 py-3 rounded-xl bg-green-600 text-white font-semibold disabled:opacity-40">
              {clear?"✓ Log out":"Resolve all to log out"}
            </button>
            <button onClick={onCancel} className="px-4 py-3 rounded-xl bg-white border text-sm">Keep working</button>
          </div>
        </React.Fragment>}
      </div>
    </div>
  );
}

/* ================== COUNTDOWN PILL ================== */
function CountdownPill({events}){
  const [,setTick]=useState(0);
  useEffect(()=>{ const id=setInterval(()=>setTick(t=>t+1),30000); return ()=>clearInterval(id); },[]);
  if(!events.length) return null;
  const next=events[0];
  const ms=next.when.getTime()-Date.now();
  const soon=ms<30*60000;
  return (
    <div className={"px-4 py-2 text-sm text-center "+(soon?"bg-red-600 text-white":"bg-indigo-600 text-white")}>
      ⏱ Next {next.type.toLowerCase()}: <b>{next.lead.Clinic||next.lead.Name}</b> — {fmtWhen(next.when)} · in <b>{fmtCountdown(ms)}</b>
      {events.length>1 && <span className="opacity-80"> · +{events.length-1} more</span>}
    </div>
  );
}

/* ================== ADMIN PASSWORD GATE ================== */
function AdminGate({onOk,onCancel}){
  const [pw,setPw]=useState("");
  const [err,setErr]=useState(false);
  const [busy,setBusy]=useState(false);
  // Checked on the server (CONFIG.ADMIN_PASSWORD in Code_v2.gs) -- never compared
  // in this public file. A correct password returns a session key that is then
  // required for every admin-only write -- see apiPost() above.
  async function submit(e){ if(e) e.preventDefault();
    if(!pw || busy) return;
    setBusy(true);
    const res=await apiPost({action:"adminAuth", password:pw});
    setBusy(false);
    if(res && res.ok && res.key){ try{ sessionStorage.setItem("reactivify.adminKey", res.key); }catch(e){} setErr(false); onOk(); } else { setErr(true); } }
  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6">
      <div className="text-3xl font-bold text-indigo-600 mb-1">Reactivify</div>
      <div className="text-slate-500 mb-8">Admin panel — enter password</div>
      <form onSubmit={submit} className="w-full max-w-sm flex flex-col gap-3">
        <input type="password" autoFocus value={pw}
          onChange={e=>{ setPw(e.target.value); setErr(false); }}
          placeholder="Password"
          className={"w-full px-4 py-3 rounded-2xl border shadow-sm outline-none "+(err?"border-red-400 focus:border-red-500":"border-slate-200 focus:border-indigo-400")}/>
        {err && <div className="text-xs text-red-500 -mt-1 px-1">Incorrect password. Try again.</div>}
        <button type="submit" disabled={busy}
          className="py-3 rounded-2xl font-semibold shadow-sm bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50">{busy?"Checking...":"Unlock"}</button>
        <button type="button" onClick={onCancel}
          className="py-2 text-sm text-slate-500 hover:text-slate-700">← Back</button>
      </form>
    </div>
  );
}

/* ================== DEVICE APPROVAL GATE (interns only) ==================
   First login from a new browser registers the device as "pending" and waits
   here until an admin approves it from the admin panel. Approved devices skip
   this screen forever. A member may use as many approved devices as they like. */
function DeviceGate({user,onApproved,onCancel}){
  const [phase,setPhase]=useState("checking");   // checking | pending | denied | error
  const deviceId=getDeviceId();
  const pollRef=useRef(null);

  async function runCheck(first){
    try{
      const ip = first ? await fetchIP() : "";
      const res = await apiPost({action:"deviceCheck", name:user, deviceId,
        ip, userAgent:(navigator.userAgent||"").slice(0,180)});
      if(res && res.ok && res.status==="approved"){ onApproved(); return; }
      if(res && res.ok && res.status==="denied"){ setPhase("denied"); return; }
      setPhase("pending");
    }catch(e){ setPhase("error"); }
  }
  useEffect(()=>{ runCheck(true); },[]);
  // While pending, poll for the admin's approval so it unlocks on its own.
  useEffect(()=>{
    if(phase!=="pending") return;
    pollRef.current=setInterval(async()=>{
      const s=await apiPost({action:"deviceStatus", deviceId});
      if(s && s.ok && s.status==="approved"){ clearInterval(pollRef.current); onApproved(); }
      else if(s && s.ok && s.status==="denied"){ clearInterval(pollRef.current); setPhase("denied"); }
    },12000);
    return ()=>clearInterval(pollRef.current);
  },[phase]);

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center">
      <div className="text-3xl font-bold text-indigo-600 mb-1">Reactivify</div>
      <div className="text-slate-500 mb-6">Signing in as <b>{user}</b></div>
      <div className="w-full max-w-sm bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
        {phase==="checking" &&
          <div className="text-slate-600">Checking this device…</div>}
        {phase==="pending" &&
          <div>
            <div className="text-4xl mb-3">🔒</div>
            <div className="font-semibold text-slate-800 mb-1">Waiting for admin approval</div>
            <div className="text-sm text-slate-500">This is a new device. An admin needs to approve it once from the admin panel (Team → Device access). It will unlock here automatically — you can leave this open.</div>
            <button onClick={()=>runCheck(false)} className="mt-4 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">Check again</button>
          </div>}
        {phase==="denied" &&
          <div>
            <div className="text-4xl mb-3">⛔</div>
            <div className="font-semibold text-slate-800 mb-1">Access denied</div>
            <div className="text-sm text-slate-500">This device isn’t allowed. Contact your admin if you think this is a mistake.</div>
          </div>}
        {phase==="error" &&
          <div>
            <div className="text-sm text-red-500 mb-3">Couldn’t reach the server.</div>
            <button onClick={()=>runCheck(false)} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">Retry</button>
          </div>}
      </div>
      <button onClick={onCancel} className="mt-6 text-sm text-slate-500 hover:text-slate-700">← Back</button>
    </div>
  );
}

/* ============ QUICK SCHEDULE (book meeting / follow-up) ============ */
function QuickSchedule({leads,user,refresh,notify}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState("");
  const [leadId,setLeadId]=useState("");
  const [manualLead,setManualLead]=useState(null);
  const [creating,setCreating]=useState(false);
  const [nc,setNc]=useState({clinic:"",name:"",phone:"",email:""});
  const [kind,setKind]=useState("meeting");            // meeting | followup | internal
  const [dt,setDt]=useState({date:todayISO(),time:"11:00"});
  const [email,setEmail]=useState("");
  const [saving,setSaving]=useState(false);
  const [title,setTitle]=useState("");                 // internal meeting title
  const [meetLink,setMeetLink]=useState("");           // created Google Meet link

  const matches = (q.trim()
    ? leads.filter(l=>((l.Clinic||"")+" "+(l.Name||"")+" "+(l.Phone||"")+" "+(l.City||"")).toLowerCase().indexOf(q.trim().toLowerCase())>=0)
    : leads).slice(0,25);
  const sel = leads.find(l=>String(l.ID)===String(leadId)) || (manualLead && String(manualLead.ID)===String(leadId) ? manualLead : null);

  function reset(){ setLeadId(""); setManualLead(null); setCreating(false); setQ(""); setNc({clinic:"",name:"",phone:"",email:""}); setEmail(""); setTitle(""); setMeetLink(""); }

  // Internal meeting: no clinic/lead needed. Creates a Google Meet + calendar
  // invite and emails the join link to the address entered.
  async function saveInternal(){
    if(!email.trim()){ notify("Enter the attendee's email"); return; }
    setSaving(true); setMeetLink("");
    const res=await apiPost({action:"internalMeeting", title:title.trim(), email:email.trim(), date:dt.date, time:dt.time});
    setSaving(false);
    if(res.ok){ setMeetLink(res.link||res.htmlLink||""); notify("Meeting created & invite sent ✓"); refreshLight(); }
    else notify("Failed: "+(res.error||"unknown"));
  }

  async function createLead(){
    if(!nc.clinic.trim() && !nc.name.trim()){ notify("Enter a business or owner name"); return; }
    setSaving(true);
    const lead={Clinic:nc.clinic.trim(), Name:nc.name.trim(), Phone:nc.phone.trim(), Email:nc.email.trim(), Status:"New", "Assigned To": (user==="Team"?"Team":user)};
    const res=await apiPost({action:"upsert", lead});
    setSaving(false);
    if(res.ok && res.lead){ setManualLead(res.lead); setLeadId(res.lead.ID); setEmail(res.lead.Email||""); setCreating(false); refreshLight(); }
    else notify("Create failed: "+(res.error||"unknown"));
  }

  async function save(){
    if(!leadId){ notify("Pick or create a lead first"); return; }
    setSaving(true);
    const patch = kind==="meeting"
      ? {ID:leadId, Email:email, Status:"Meeting Booked", "Meeting Date":dt.date, "Meeting Time":dt.time}
      : {ID:leadId, Email:email, Status:"Schedule Follow-up", "Followup Date":dt.date, "Followup Time":dt.time, "Followup Sent":""};
    const res=await apiPost({action:"upsert", lead:patch});
    setSaving(false);
    if(res.ok){ notify(kind==="meeting"?"Meeting booked ✓":"Follow-up scheduled ✓"); setOpen(false); reset(); refreshLight(); }
    else notify("Failed: "+res.error);
  }

  if(!open) return <button onClick={()=>setOpen(true)} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium">＋ Book meeting / follow-up</button>;
  return (
    <div className="bg-white rounded-2xl border border-indigo-200 p-4 space-y-3 shadow-sm">
      <div className="flex items-center justify-between">
        <div className="font-semibold">Log a meeting or follow-up</div>
        <button onClick={()=>{setOpen(false);reset();}} className="text-slate-400 text-lg leading-none">✕</button>
      </div>
      <div className="flex gap-1 bg-slate-100 rounded-full p-1 w-max">
        <button onClick={()=>setKind("meeting")} className={"px-3 py-1 rounded-full text-sm "+(kind==="meeting"?"bg-white shadow":"")}>Meeting</button>
        <button onClick={()=>setKind("followup")} className={"px-3 py-1 rounded-full text-sm "+(kind==="followup"?"bg-white shadow":"")}>Follow-up</button>
        <button onClick={()=>{setKind("internal");setMeetLink("");}} className={"px-3 py-1 rounded-full text-sm "+(kind==="internal"?"bg-white shadow":"")}>Internal</button>
      </div>

      {kind==="internal" &&
        <div className="space-y-2">
          <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Meeting title (optional)" className="w-full border rounded-lg px-3 py-2 text-sm"/>
          <label className="text-xs font-medium text-slate-600">Attendee email <span className="text-red-500">*</span></label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@email.com"
            className={"w-full border rounded-lg px-3 py-2 text-sm "+(email?"border-slate-200":"border-red-300 bg-red-50")}/>
          <div className="flex gap-2">
            <input type="date" value={dt.date} onChange={e=>setDt({...dt,date:e.target.value})} className="border rounded-lg px-2 py-1 text-sm flex-1"/>
            <input type="time" value={dt.time} onChange={e=>setDt({...dt,time:e.target.value})} className="border rounded-lg px-2 py-1 text-sm flex-1"/>
          </div>
          <button onClick={saveInternal} disabled={saving} className="w-full py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold disabled:opacity-40">
            {saving?"Creating…":"📹 Create Google Meet + send invite"}</button>
          {meetLink && <div className="text-xs bg-emerald-50 rounded-lg p-2 break-all">✓ Sent. Meet link: <a href={meetLink} target="_blank" rel="noopener" className="text-emerald-700 underline">{meetLink}</a></div>}
          <div className="text-[11px] text-slate-400">No clinic/lead needed — creates a Google Meet, adds a calendar invite for the email, and sends them the link.</div>
        </div>}

      {kind!=="internal" && (sel
        ? <div className="flex items-center justify-between bg-slate-50 rounded-lg px-3 py-2">
            <div><div className="font-medium text-sm">{sel.Clinic||sel.Name}</div><div className="text-xs text-slate-400">{sel.Phone} · {sel.City||""}</div></div>
            <button onClick={reset} className="text-xs text-indigo-600">change</button>
          </div>
        : creating
          ? <div className="space-y-2 border rounded-lg p-3 bg-slate-50">
              <div className="text-sm font-medium">New clinic</div>
              <input value={nc.clinic} onChange={e=>setNc({...nc,clinic:e.target.value})} placeholder="Clinic name" className="w-full border rounded-lg px-3 py-2 text-sm"/>
              <input value={nc.name} onChange={e=>setNc({...nc,name:e.target.value})} placeholder="Owner name" className="w-full border rounded-lg px-3 py-2 text-sm"/>
              <input value={nc.phone} onChange={e=>setNc({...nc,phone:e.target.value})} placeholder="Phone number (e.g. 98765 43210)" className="w-full border rounded-lg px-3 py-2 text-sm"/>
              <input type="email" value={nc.email} onChange={e=>setNc({...nc,email:e.target.value})} placeholder="Owner email" className="w-full border rounded-lg px-3 py-2 text-sm"/>
              <div className="flex gap-2">
                <button onClick={createLead} disabled={saving} className="flex-1 py-2 rounded-lg bg-indigo-600 text-white text-sm disabled:opacity-40">{saving?"Creating…":"Create & select"}</button>
                <button onClick={()=>setCreating(false)} className="px-3 py-2 rounded-lg bg-white border text-sm">Cancel</button>
              </div>
            </div>
          : <div>
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search a lead by clinic / name / phone" className="w-full border rounded-lg px-3 py-2 text-sm"/>
              <div className="mt-1 max-h-52 overflow-y-auto no-scrollbar border rounded-lg divide-y divide-slate-100">
                {matches.map(l=>(
                  <button key={l.ID} onClick={()=>{setLeadId(l.ID);setEmail(l.Email||"");}} className="w-full text-left px-3 py-2 hover:bg-slate-50">
                    <div className="font-medium text-sm">{l.Clinic||l.Name}</div>
                    <div className="text-xs text-slate-400">{l.Phone} · {l.City} · {l["Assigned To"]||"unassigned"}</div>
                  </button>
                ))}
                {matches.length===0 && <div className="px-3 py-2 text-sm text-slate-400">No matching leads — create it below.</div>}
              </div>
              <div className="text-[11px] text-slate-400 mt-1">{leads.length} leads · type to search all of them</div>
              <button onClick={()=>{setCreating(true);setNc({clinic:q,name:"",phone:"",email:""});}} className="mt-2 w-full py-2 rounded-lg border border-dashed border-indigo-300 text-indigo-600 text-sm font-medium">＋ Create new clinic</button>
            </div>)}

      {kind!=="internal" && sel &&
        <div>
          <label className="text-xs font-medium text-slate-600">Owner email <span className="text-red-500">*required</span></label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@business.com"
            className={"w-full border rounded-lg px-3 py-2 text-sm "+(email?"border-slate-200":"border-red-300 bg-red-50")}/>
          <div className="text-[11px] text-slate-400 mt-0.5">Needed to send them the meeting link — you can still save without it.</div>
        </div>}

      {kind!=="internal" && sel &&
        <div className="flex gap-2">
          <input type="date" value={dt.date} onChange={e=>setDt({...dt,date:e.target.value})} className="border rounded-lg px-2 py-1 text-sm flex-1"/>
          <input type="time" value={dt.time} onChange={e=>setDt({...dt,time:e.target.value})} className="border rounded-lg px-2 py-1 text-sm flex-1"/>
        </div>}
      {kind!=="internal" && sel &&
        <button onClick={save} disabled={saving||!leadId} className="w-full py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold disabled:opacity-40">

  );

/* ============ CLOSING PIPELINE (meetings / follow-ups) ============ */
function isClosed_(status){ return CLOSED_STATUSES.some(function(s){ return String(status||"").toLowerCase()===s.toLowerCase(); }); }

function pipelineEvents(leads){
  const out=[];
  leads.forEach(function(l){
    if(/^meeting booked$/i.test(l.Status||"")){ const at=leadDateTime(l["Meeting Date"],l["Meeting Time"]); if(at) out.push({lead:l,type:"Meeting",when:at}); }
    if(/^schedule follow-up$/i.test(l.Status||"")){ const at=leadDateTime(l["Followup Date"],l["Followup Time"]); if(at) out.push({lead:l,type:"Follow-up",when:at}); }
  });
  return out;
}

function CloseItem({item,refresh,notify}){
  const l=item.lead;
  const [busy,setBusy]=useState(false);
  const [resched,setResched]=useState(false);
  const [dt,setDt]=useState({date:todayISO(),time:"11:00"});
  const overdueHrs=(Date.now()-item.when.getTime())/3600000;
  async function closeAs(status){
    if(!status) return;
    setBusy(true);
    // dial:false — closing a meeting isn't a fresh dial, so it shouldn't inflate the dial count.
    const res=await apiPost({action:"upsert", lead:{ID:l.ID, Status:status}, logStat:{intern:l["Assigned To"]||"", outcome:status, dial:false}});
    setBusy(false); if(res.ok){ notify("Closed: "+status); refreshLight(); } else notify("Failed: "+res.error);
  }
  const [shown,setShown]=useState(false);
  async function markShowup(){
    // Logs a "Showed Up" event (dial:false so it doesn't count as a call) without changing the status,
    // so you can still close the meeting afterwards.
    setBusy(true);
    const res=await apiPost({action:"upsert", lead:{ID:l.ID}, logStat:{intern:l["Assigned To"]||"", outcome:"Showed Up", dial:false}});
    setBusy(false); if(res.ok){ setShown(true); notify("Marked showed up ✓"); } else notify("Failed: "+res.error);
  }
  async function saveResched(){
    setBusy(true);
    const extra=item.type==="Meeting"
      ? {Status:"Meeting Booked","Meeting Date":dt.date,"Meeting Time":dt.time,"DayBefore Sent":"","1Hr Sent":"","30Min Sent":""}
      : {Status:"Schedule Follow-up","Followup Date":dt.date,"Followup Time":dt.time,"Followup Sent":""};
    const res=await apiPost({action:"upsert", lead:Object.assign({ID:l.ID},extra)});
    setBusy(false); setResched(false); if(res.ok){ notify("Rescheduled"); refreshLight(); } else notify("Failed");
  }
  async function cancelIt(){
    if(!confirm("Delete this "+item.type.toLowerCase()+"? It will be removed from the pipeline and the calendar (the lead stays).")) return;
    setBusy(true);
    const extra=item.type==="Meeting"
      ? {Status:"Interested","Meeting Date":"","Meeting Time":""}
      : {Status:"Interested","Followup Date":"","Followup Time":"","Followup Sent":""};
    const res=await apiPost({action:"upsert", lead:Object.assign({ID:l.ID},extra)});
    setBusy(false); if(res.ok){ notify("Deleted"); refreshLight(); } else notify("Failed");
  }
  return (
    <div className="border-t border-slate-100 py-2 first:border-0">
      <div className="text-sm">
        <span className={"px-2 py-0.5 rounded-full text-xs mr-2 "+(item.type==="Meeting"?"bg-green-100 text-green-700":"bg-amber-100 text-amber-700")}>{item.type}</span>
        <b>{l.Clinic||l.Name}</b>
        <span className="text-slate-400"> · {fmtWhen(item.when)} · {l["Assigned To"]||"unassigned"}</span>
        {overdueHrs>2 && <span className="ml-2 text-red-500 text-xs">no-show risk</span>}
      </div>
      {!resched
        ? <div className="flex flex-wrap gap-2 mt-1 items-center">
            {l.Phone && <a href={"tel:"+digits(l.Phone)} className="px-2 py-1 rounded-lg bg-green-600 text-white text-xs">📞 Call</a>}
            {item.type==="Meeting" && <button onClick={markShowup} disabled={busy||shown} className={"px-2 py-1 rounded-lg text-xs "+(shown?"bg-emerald-100 text-emerald-700":"bg-emerald-600 text-white")}>{shown?"✓ Showed up":"✅ Showed up"}</button>}
            <select disabled={busy} value="" onChange={e=>closeAs(e.target.value)} className="border rounded-lg px-2 py-1 text-sm">
              <option value="">Close as…</option>
              <option>Landed</option><option>No Show</option><option>Interested</option><option>Not Interested</option><option>Dumped</option>
            </select>
            <button onClick={()=>setResched(true)} className="px-2 py-1 rounded-lg bg-slate-100 text-sm">Reschedule</button>
            <button onClick={cancelIt} disabled={busy} className="px-2 py-1 rounded-lg bg-red-50 text-red-600 text-sm">✕ Delete</button>
          </div>
        : <div className="flex flex-wrap gap-2 mt-1 items-center">
            <input type="date" value={dt.date} onChange={e=>setDt({...dt,date:e.target.value})} className="border rounded-lg px-2 py-1 text-sm"/>
            <input type="time" value={dt.time} onChange={e=>setDt({...dt,time:e.target.value})} className="border rounded-lg px-2 py-1 text-sm"/>
            <button onClick={saveResched} disabled={busy} className="px-2 py-1 rounded-lg bg-indigo-600 text-white text-sm">Save</button>
            <button onClick={()=>setResched(false)} className="px-2 py-1 rounded-lg bg-white border text-sm">Cancel</button>
          </div>}
    </div>
  );
}

function MeetingsPipeline({leads,refresh,notify}){
  const [,setTick]=useState(0);
  useEffect(()=>{ const id=setInterval(()=>setTick(t=>t+1),60000); return ()=>clearInterval(id); },[]);
  const now=Date.now();
  const all=pipelineEvents(leads);
  const due=all.filter(e=>e.when.getTime()<=now).sort((a,b)=>a.when-b.when);
  const up=all.filter(e=>e.when.getTime()>now).sort((a,b)=>a.when-b.when);
  async function cancelEvent(e){
    if(!confirm("Delete this "+e.type.toLowerCase()+" for "+(e.lead.Clinic||e.lead.Name)+"?")) return;
    const extra=e.type==="Meeting"?{Status:"Interested","Meeting Date":"","Meeting Time":""}:{Status:"Interested","Followup Date":"","Followup Time":"","Followup Sent":""};
    const res=await apiPost({action:"upsert", lead:Object.assign({ID:e.lead.ID},extra)});
    if(res.ok){ notify("Deleted"); refresh(); } else notify("Failed");
  }
  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="font-semibold mb-1">🔴 Needs closing ({due.length})</div>
        <div className="text-[11px] text-slate-400 mb-2">Meetings & follow-ups whose time has passed but aren’t closed yet. Close each with an outcome (or reschedule) so nothing sits in limbo.</div>
        {due.length===0
          ? <div className="text-sm text-slate-400">Nothing waiting to be closed. 🎉</div>
          : due.map((e,i)=><CloseItem key={(e.lead.ID||i)+"_"+e.type} item={e} refresh={refresh} notify={notify}/>)}
      </div>
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="font-semibold mb-2">📅 Upcoming ({up.length})</div>
        {up.length===0
          ? <div className="text-sm text-slate-400">No upcoming meetings or follow-ups.</div>
          : up.map((e,i)=>(
              <div key={(e.lead.ID||i)+"_"+e.type} className="flex items-center justify-between text-sm border-t border-slate-100 py-2 first:border-0">
                <div>
                  <span className={"px-2 py-0.5 rounded-full text-xs mr-2 "+(e.type==="Meeting"?"bg-green-100 text-green-700":"bg-amber-100 text-amber-700")}>{e.type}</span>
                  <b>{e.lead.Clinic||e.lead.Name}</b> <span className="text-slate-400">· {e.lead["Assigned To"]||""}</span>
                </div>
                <div className="flex items-center gap-3">
                  <span className="text-slate-500">{fmtWhen(e.when)} · <b className={e.when.getTime()-now<30*60000?"text-red-600":""}>{fmtCountdown(e.when.getTime()-now)}</b></span>
                  <button onClick={()=>cancelEvent(e)} className="text-red-400 hover:text-red-600 text-xs">✕</button>
                </div>
              </div>
            ))}
      </div>
    </div>
  );
}

// How many calls each intern made on a chosen day. Uses the true per-call log
// (every dial, redials included) when available; falls back to "leads worked
// that day" for older dates from before call-logging existed.
function DailyActivity({leads,internNames}){
  const [day,setDay]=useState(todayISO());
  const [daily,setDaily]=useState(null);
  useEffect(function(){ apiGet("getDailyCalls").then(function(r){ if(r&&r.ok) setDaily(r.daily||{}); }).catch(function(){}); },[]);
  const rows=internNames.map(function(name){
    const dd = daily && daily[day] && daily[day][name];
    if(dd){
      const by={}; Object.keys(dd).forEach(function(k){ if(k!=="calls") by[k]=dd[k]; });
      return { name:name, count:dd.calls||0, by:by, real:true };
    }
    const mine=leads.filter(function(l){ return String(l["Assigned To"]||"").trim().toLowerCase()===name.toLowerCase(); });
    const worked=mine.filter(function(l){ return day && String(l["Last Follow-up Date"]||"").indexOf(day)>=0; });
    const by={}; worked.forEach(function(l){ const s=statusOf(l); by[s]=(by[s]||0)+1; });
    return { name:name, count:worked.length, by:by, real:false };
  });
  const total=rows.reduce(function(a,r){ return a+r.count; },0);
  const anyReal=rows.some(function(r){ return r.real; });
  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-4">
      <div className="flex items-center justify-between flex-wrap gap-2 mb-1">
        <div className="font-semibold">📞 Calls per day</div>
        <div className="flex items-center gap-2 text-sm"><span className="text-slate-500">Day:</span>
          <input type="date" value={day} onChange={function(e){ setDay(e.target.value); }} className="border rounded-lg px-2 py-1 text-sm"/></div>
      </div>
      <div className="text-[11px] text-slate-400 mb-2">{anyReal?"Every call logged that day (redials counted).":"Leads worked that day (redials count once — this date predates call-logging)."} · <b>{total}</b> total</div>
      <div className="space-y-1">
        {rows.map(function(r){
          return <div key={r.name} className="flex items-center justify-between text-sm border-t border-slate-100 py-1.5 first:border-0">
            <span className="font-medium">{r.name}</span>
            <span className="text-right"><b className="text-base">{r.count}</b>{r.count>0 && <span className="text-slate-400 text-[11px] ml-2">{Object.keys(r.by).map(function(k){ return k+" "+r.by[k]; }).join(" · ")}</span>}</span>
          </div>;
        })}
      </div>
    </div>
  );
}
